<app-ficha-detalle *ngIf="doteData">
    <app-ficha-cabecera
        [tipo]="tipoCabecera"
        [nombre]="doteData.Nombre"
        [subtitulo]="descripcionEnCabecera ? doteData.Descripcion : null"
        [manual]="doteData.Manual"
        [oficial]="doteData.Oficial"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="descripcionEnCabecera ? null : doteData.Descripcion"></app-ficha-seccion>
        <app-ficha-seccion titulo="Beneficio" [texto]="doteData.Beneficio"></app-ficha-seccion>
        <app-ficha-seccion titulo="Normal" [texto]="doteData.Normal"></app-ficha-seccion>
        <app-ficha-seccion titulo="Especial" [texto]="doteData.Especial"></app-ficha-seccion>

        <app-ficha-lateral titulo="Prerrequisitos">
            <!-- Cada condición es la frase que escribe la API («Lanzador arcano de nivel 3»). -->
            <app-ficha-prerrequisitos
                [grupos]="prerrequisitosAgrupados"
                [esNavegable]="esPrerrequisitoNavegable"
                textoVacio="Sin prerrequisitos."
                (abrir)="abrirDetallePrerrequisito($event)">
            </app-ficha-prerrequisitos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="En resumen">
            <app-ficha-datos [datos]="resumen" [columnas]="2" [tarjeta]="false"></app-ficha-datos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Extras" *ngIf="tieneExtras()">
            <p class="ficha-nota">Admite: {{getTextoExtrasSoportados()}}</p>
            <div class="ficha-grupo" *ngFor="let extra of getExtrasDisponibles()">
                <h3 class="ficha-subtitulo">
                    {{extra.nombre}}
                    <span class="ficha-subtitulo__ayuda" *ngIf="bloqueExtraRequiereCompetencia(extra.nombre)">Requiere competencia</span>
                </h3>
                <p class="ficha-nota" *ngIf="extra.todoElCatalogo">Cualquiera del catálogo.</p>
                <ul class="ficha-lista ficha-lista--columnas" *ngIf="extra.items.length > 0">
                    <li class="ficha-lista__item" *ngFor="let item of extra.items">
                        <button type="button" class="ficha-enlace" *ngIf="esExtraNavegable(extra.nombre); else extraSinEnlace"
                            (click)="abrirDetalleExtra(extra.nombre, item)">{{item.Nombre}}</button>
                        <ng-template #extraSinEnlace><span>{{item.Nombre}}</span></ng-template>
                    </li>
                </ul>
            </div>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Habilidades otorgadas" *ngIf="habilidadesBase.length > 0 || habilidadesCustom.length > 0">
            <div class="ficha-grupo" *ngIf="habilidadesBase.length > 0">
                <h3 class="ficha-subtitulo" *ngIf="habilidadesCustom.length > 0">Base</h3>
                <ng-container *ngTemplateOutlet="habilidades; context: { $implicit: habilidadesBase }"></ng-container>
            </div>
            <div class="ficha-grupo" *ngIf="habilidadesCustom.length > 0">
                <h3 class="ficha-subtitulo">Custom</h3>
                <ng-container *ngTemplateOutlet="habilidades; context: { $implicit: habilidadesCustom }"></ng-container>
            </div>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Modificadores" *ngIf="getModificadoresActivos().length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let mod of getModificadoresActivos()">
                    {{mod.clave}} {{mod.valor > 0 ? '+' : ''}}{{mod.valor}}
                </li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>

<!-- «Avistar … +2»: la habilidad, con su extra, y los rangos que da. -->
<ng-template #habilidades let-filas>
    <table class="ficha-pares">
        <tbody>
            <tr *ngFor="let habilidad of filas">
                <td>{{habilidad.nombre}}</td>
                <td>{{habilidad.valor}}</td>
            </tr>
        </tbody>
    </table>
</ng-template>
