<app-ficha-detalle *ngIf="tipo">
    <app-ficha-cabecera
        tipo="Tipo de criatura"
        [nombre]="tipo.Nombre"
        [manual]="tipo.Manual"
        [oficial]="tipo.Oficial"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" [columnas]="3" titulo="Datos del tipo de criatura"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="tipo.Descripcion"></app-ficha-seccion>

        <app-ficha-lateral titulo="Naturaleza">
            <app-ficha-datos [datos]="naturaleza" [columnas]="2" [tarjeta]="false" titulo="Naturaleza"></app-ficha-datos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Rasgos" *ngIf="rasgos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let rasgo of rasgos">
                    <button type="button" class="ficha-enlace" (click)="verDetallesRasgo(rasgo)">{{rasgo.Nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
