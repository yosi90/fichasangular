<app-ficha-detalle *ngIf="deidad">
    <app-ficha-cabecera icono="deidad"
        tipo="Deidad"
        [nombre]="deidad.Nombre"
        [manual]="deidad.Manual"
        [oficial]="deidad.Oficial"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos de la deidad"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="deidad.Descripcion"></app-ficha-seccion>

        <app-ficha-lateral titulo="Ámbitos" *ngIf="ambitos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let ambito of ambitos">{{ambito}}</li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Dominios" *ngIf="dominios.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let dominio of dominios">{{dominio}}</li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
