<app-ficha-detalle *ngIf="manual">
    <app-ficha-cabecera icono="manual" tipo="Manual" [nombre]="manual.Nombre" [oficial]="manual.Oficial"></app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos del manual"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Sin asociados" *ngIf="!hayAsociados">
            <p class="ficha-nota">Este manual no tiene entradas asociadas.</p>
        </app-ficha-seccion>

        <!-- Qué secciones se enseñan debajo: todas al abrirlo. -->
        <app-ficha-lateral titulo="Resumen por sección" *ngIf="hayAsociados">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let seccion of seccionesRender">
                        <td>
                            <mat-checkbox [checked]="isSeccionActiva(seccion.key)" (change)="toggleSeccion(seccion.key)">
                                {{seccion.label}}
                            </mat-checkbox>
                        </td>
                        <td>{{contarSeccion(seccion.key)}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>
    </app-ficha-cuerpo>

    <app-ficha-bloque *ngFor="let bloque of bloquesFiltrados" [titulo]="bloque.seccion.label + ' (' + bloque.filas.length + ')'">
        <table class="ficha-tabla">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let fila of bloque.filas">
                    <td>
                        <button type="button" class="ficha-enlace" *ngIf="esReferenciaNavegable(bloque.seccion.key, fila.referencia); else sinEnlace"
                            [matTooltip]="getTooltipReferencia(bloque.seccion.key, fila.referencia)" matTooltipClass="tt-accent" [matTooltipShowDelay]="250"
                            (click)="abrirReferencia(bloque.seccion.key, fila.referencia, $event)">{{fila.referencia.Nombre}}</button>
                        <ng-template #sinEnlace><span>{{fila.referencia.Nombre}}</span></ng-template>
                    </td>
                    <td>
                        {{fila.descripcion}}
                        <span class="ficha-nota" *ngIf="fila.extras"> {{fila.extras}}</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </app-ficha-bloque>
</app-ficha-detalle>
