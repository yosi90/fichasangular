<app-ficha-detalle *ngIf="especial">
    <app-ficha-cabecera
        tipo="Especial de clase"
        [nombre]="especial.Nombre"
        [oficial]="especial.Oficial"
        [etiquetas]="etiquetas">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos del especial"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="especial.Descripcion"></app-ficha-seccion>

        <app-ficha-lateral titulo="Bonificadores" *ngIf="bonificadores.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let mod of bonificadores">
                        <td>{{mod.clave}}</td>
                        <td>{{mod.valor > 0 ? '+' : ''}}{{mod.valor}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Lo que da el extra" *ngIf="flagsExtra.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let flag of flagsExtra">
                    <mat-icon class="ficha-icono" aria-hidden="true">check</mat-icon>
                    <span>{{flag}}</span>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Extras" *ngIf="extras.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let extra of extras">
                        <td>{{extra.Extra}}</td>
                        <td><span class="ficha-nota">orden</span> {{extra.Orden}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Habilidades" *ngIf="habilidades.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let habilidad of habilidades">
                        <td>{{habilidad.nombre}} <span class="ficha-nota" *ngIf="tieneTextoVisible(habilidad.extra)">({{habilidad.extra}})</span></td>
                        <td>{{habilidad.rangos}} <span class="ficha-nota">{{habilidad.rangos === 1 ? 'rango' : 'rangos'}}</span></td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
