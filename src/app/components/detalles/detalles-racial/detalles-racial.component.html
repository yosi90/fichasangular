<app-ficha-detalle *ngIf="racial">
    <app-ficha-cabecera icono="racial" tipo="Racial" [nombre]="racial.Nombre" [oficial]="racial.Oficial"></app-ficha-cabecera>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="racial.Descripcion"></app-ficha-seccion>

        <app-ficha-lateral titulo="Prerrequisitos" *ngIf="tienePrerrequisitos">
            <!-- Cada condición es la frase que escribe la API («Elfo», «Carisma 10»); la raza lleva a su detalle. -->
            <app-ficha-prerrequisitos
                [grupos]="prerrequisitosAgrupados"
                [esNavegable]="esPrerrequisitoNavegable"
                (abrir)="abrirDetallePrerrequisito($event)">
                <ul class="ficha-lista" *ngIf="flagsPrerrequisito.length > 0">
                    <li class="ficha-lista__item" *ngFor="let flag of flagsPrerrequisito">
                        <mat-icon class="ficha-icono" aria-hidden="true">check</mat-icon>
                        <span>{{flag}}</span>
                    </li>
                </ul>
            </app-ficha-prerrequisitos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Características" *ngIf="caracteristicas.length > 0">
            <ng-container *ngTemplateOutlet="bonificadores; context: { $implicit: caracteristicas }"></ng-container>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Salvaciones" *ngIf="salvaciones.length > 0">
            <ng-container *ngTemplateOutlet="bonificadores; context: { $implicit: salvaciones }"></ng-container>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Habilidades" *ngIf="habilidadesBase.length > 0 || habilidadesCustom.length > 0">
            <div class="ficha-grupo" *ngIf="habilidadesBase.length > 0">
                <h3 class="ficha-subtitulo" *ngIf="habilidadesCustom.length > 0">Base</h3>
                <ng-container *ngTemplateOutlet="bonificadores; context: { $implicit: habilidadesBase }"></ng-container>
            </div>
            <div class="ficha-grupo" *ngIf="habilidadesCustom.length > 0">
                <h3 class="ficha-subtitulo">Custom</h3>
                <ng-container *ngTemplateOutlet="bonificadores; context: { $implicit: habilidadesCustom }"></ng-container>
            </div>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Dotes" *ngIf="dotes.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let dote of dotes">
                    <span>
                        <button type="button" class="ficha-enlace" *ngIf="esIdNavegable(dote.id); else doteTexto"
                            (click)="emitirDote(dote.id)">{{dote.nombre}}</button>
                        <ng-template #doteTexto>{{dote.nombre}}</ng-template>
                        <span class="ficha-nota" *ngIf="dote.extra"> ({{dote.extra}})</span>
                    </span>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Aptitudes sortílegas" *ngIf="sortilegas.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let sortilega of sortilegas">
                    <span>
                        <button type="button" class="ficha-enlace" *ngIf="esIdNavegable(sortilega.id); else sortilegaTexto"
                            (click)="emitirConjuro(sortilega.id)">{{sortilega.nombre}}</button>
                        <ng-template #sortilegaTexto>{{sortilega.nombre}}</ng-template>
                        <span class="ficha-nota" *ngIf="sortilega.detalle"> · {{sortilega.detalle}}</span>
                    </span>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Incarnum" *ngIf="datosEsencia.length > 0">
            <app-ficha-datos [datos]="datosEsencia" [columnas]="2" [tarjeta]="false" titulo="Incarnum"></app-ficha-datos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Ataques" *ngIf="ataques.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let ataque of ataques">{{ataque}}</li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>

<!-- Nombre a la izquierda y bonificador a la derecha, con la condición debajo («Voluntad … +1»). -->
<ng-template #bonificadores let-filas>
    <table class="ficha-pares">
        <tbody>
            <tr *ngFor="let fila of filas">
                <td>
                    {{fila.nombre}}
                    <div class="ficha-nota" *ngFor="let nota of fila.notas">{{nota}}</div>
                </td>
                <td>{{fila.valor}}</td>
            </tr>
        </tbody>
    </table>
</ng-template>
