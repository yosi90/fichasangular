<app-ficha-detalle *ngIf="rasgo">
    <app-ficha-cabecera icono="rasgo" tipo="Rasgo" [nombre]="rasgo.Nombre" [oficial]="rasgo.Oficial"
        [modificable]="puedeModificar" (modificar)="modificar.emit(rasgo)"></app-ficha-cabecera>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="rasgo.Descripcion"></app-ficha-seccion>
    </app-ficha-cuerpo>
</app-ficha-detalle>
