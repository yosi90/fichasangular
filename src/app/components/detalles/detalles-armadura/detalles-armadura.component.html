<app-ficha-detalle *ngIf="armadura">
    <app-ficha-cabecera
        [tipo]="tipoCabecera"
        [nombre]="armadura.Nombre"
        [manual]="armadura.Manual"
        [oficial]="armadura.Oficial"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" [titulo]="armadura.Es_escudo ? 'Datos del escudo' : 'Datos de la armadura'"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" *ngIf="conDescripcion">
            <app-descripcion-equipo [descripcion]="armadura.Descripcion" [origen]="armadura.Origen_descripcion"
                [nombreOriginal]="armadura.Nombre_original" [traducido]="armadura.Traducido">
            </app-descripcion-equipo>
        </app-ficha-seccion>
    </app-ficha-cuerpo>
</app-ficha-detalle>
