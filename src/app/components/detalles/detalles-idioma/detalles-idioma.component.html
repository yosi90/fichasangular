<app-ficha-detalle *ngIf="idioma">
    <app-ficha-cabecera icono="idioma" tipo="Idioma" [nombre]="idioma.Nombre" [oficial]="idioma.Oficial"
        [etiquetas]="idioma.Secreto ? etiquetasSecreto : []"
        [modificable]="modificable" (modificar)="modificar.emit(idioma)"></app-ficha-cabecera>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="idioma.Descripcion"></app-ficha-seccion>
    </app-ficha-cuerpo>
</app-ficha-detalle>
