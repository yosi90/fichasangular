<app-ficha-detalle *ngIf="idioma">
    <app-ficha-cabecera tipo="Idioma" [nombre]="idioma.Nombre" [oficial]="idioma.Oficial"
        [etiquetas]="idioma.Secreto ? etiquetasSecreto : []"></app-ficha-cabecera>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="idioma.Descripcion"></app-ficha-seccion>
    </app-ficha-cuerpo>
</app-ficha-detalle>
