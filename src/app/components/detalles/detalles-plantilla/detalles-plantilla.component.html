<app-ficha-detalle *ngIf="plantillaData">
    <app-ficha-cabecera icono="plantilla"
        tipo="Plantilla"
        [nombre]="plantillaData.Nombre"
        [manual]="plantillaData.Manual"
        [oficial]="plantillaData.Oficial"
        [etiquetas]="etiquetas"
        (abrirManual)="abrirDetalleManual()">
        <button mat-stroked-button type="button" *ngIf="puedeModificar" (click)="modificar.emit(plantillaData)">
            <mat-icon>edit</mat-icon>
            Modificar
        </button>
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos de la plantilla"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="plantillaData.Descripcion"></app-ficha-seccion>
        <app-ficha-seccion titulo="Características" *ngIf="hayCaracteristicas">
            <app-ficha-caracteristicas [modificadores]="modificadoresCaracteristicas" [minimos]="minimosCaracteristicas"></app-ficha-caracteristicas>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Combate y defensas" *ngIf="combate.length > 0">
            <app-ficha-datos [datos]="combate" [columnas]="3" [tarjeta]="false" titulo="Combate y defensas"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Ataques" [texto]="plantillaData.Ataques"></app-ficha-seccion>
        <app-ficha-seccion titulo="Ataque completo" [texto]="plantillaData.Ataque_completo"></app-ficha-seccion>
        <app-ficha-seccion titulo="Movimiento" *ngIf="hayMovimiento">
            <!-- Las velocidades que da, como las escribe el manual («Posee alas…»), y los movimientos con número. -->
            <app-texto-manual class="ficha-texto" *ngIf="tieneTextoVisible(plantillaData.Velocidades)" [texto]="plantillaData.Velocidades"></app-texto-manual>
            <app-ficha-datos [datos]="movimiento" [columnas]="3" [tarjeta]="false" titulo="Movimiento"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Dados de golpe adicionales" *ngIf="dadosGolpeAnimal.length > 0">
            <app-ficha-datos [datos]="dadosGolpeAnimal" [columnas]="3" [tarjeta]="false" titulo="Dados de golpe adicionales"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Ecología" *ngIf="ecologia.length > 0">
            <app-ficha-datos [datos]="ecologia" [columnas]="2" [tarjeta]="false" titulo="Ecología"></app-ficha-datos>
        </app-ficha-seccion>

        <app-ficha-lateral titulo="Prerrequisitos">
            <!-- Cada condición es la frase que escribe la API («Criatura de tipo humanoide (conserva su tipo)»). -->
            <app-ficha-prerrequisitos [grupos]="prerrequisitosAgrupados" textoVacio="Sin prerrequisitos."></app-ficha-prerrequisitos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Habilidades" *ngIf="habilidades.length > 0">
            <app-ficha-habilidades [base]="habilidades"></app-ficha-habilidades>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Aptitudes raciales" *ngIf="raciales.length > 0">
            <ng-container *ngTemplateOutlet="listaRaciales; context: { $implicit: raciales }"></ng-container>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Ataques especiales" *ngIf="ataquesEspeciales.length > 0">
            <ng-container *ngTemplateOutlet="listaRaciales; context: { $implicit: ataquesEspeciales }"></ng-container>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Compatibilidad de tipo" *ngIf="compatibilidades.length > 0">
            <p class="ficha-nota">Tipo de la criatura base y tipo que pasa a tener.</p>
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let comp of compatibilidades">
                        <td>{{comp.tipoComp}}</td>
                        <td>{{comp.tipoNuevo}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Subtipos" *ngIf="subtipos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let subtipo of subtipos">
                    <button type="button" class="ficha-enlace" (click)="abrirDetalleSubtipo(subtipo)">{{subtipo.Nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Dotes" *ngIf="dotes.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let dote of dotes">
                    <button type="button" class="ficha-enlace" (click)="abrirDetallesDote(dote.contexto)">{{dote.nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Aptitudes sortílegas" *ngIf="sortilegas.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let sortilega of sortilegas">
                        <td><button type="button" class="ficha-enlace" (click)="abrirDetallesConjuro(sortilega.id)">{{sortilega.nombre}}</button></td>
                        <td>{{sortilega.detalle}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>

<!-- Las aptitudes raciales o los ataques especiales: cada uno abre su detalle, con los DG desde los que lo da. -->
<ng-template #listaRaciales let-raciales>
    <ul class="ficha-lista">
        <li class="ficha-lista__item" *ngFor="let item of raciales">
            <span>
                <button type="button" class="ficha-enlace" (click)="abrirDetallesRacial(item.racial)">{{item.racial.Nombre}}</button>
                <span class="ficha-nota" *ngIf="item.desde"> · {{item.desde}}</span>
            </span>
        </li>
    </ul>
</ng-template>
