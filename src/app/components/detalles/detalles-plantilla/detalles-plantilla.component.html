<app-ficha-detalle *ngIf="plantillaData">
    <app-ficha-cabecera
        tipo="Plantilla"
        [nombre]="plantillaData.Nombre"
        [manual]="plantillaData.Manual"
        [oficial]="plantillaData.Oficial"
        [etiquetas]="etiquetas"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos de la plantilla"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="plantillaData.Descripcion"></app-ficha-seccion>
        <app-ficha-seccion titulo="Características" *ngIf="hayCaracteristicas">
            <div class="ficha-grupo" *ngIf="modificadoresCaracteristicas.length > 0">
                <h3 class="ficha-subtitulo">Modificadores</h3>
                <app-ficha-datos [datos]="modificadoresCaracteristicas" [columnas]="3" [tarjeta]="false" titulo="Modificadores de característica"></app-ficha-datos>
            </div>
            <div class="ficha-grupo" *ngIf="minimosCaracteristicas.length > 0">
                <h3 class="ficha-subtitulo">Mínimos</h3>
                <app-ficha-datos [datos]="minimosCaracteristicas" [columnas]="3" [tarjeta]="false" titulo="Características mínimas"></app-ficha-datos>
            </div>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Combate y defensas" *ngIf="combate.length > 0">
            <app-ficha-datos [datos]="combate" [columnas]="3" [tarjeta]="false" titulo="Combate y defensas"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Movimiento" *ngIf="movimiento.length > 0">
            <app-ficha-datos [datos]="movimiento" [columnas]="3" [tarjeta]="false" titulo="Movimiento"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Dados de golpe adicionales" *ngIf="dadosGolpeAnimal.length > 0">
            <app-ficha-datos [datos]="dadosGolpeAnimal" [columnas]="3" [tarjeta]="false" titulo="Dados de golpe adicionales"></app-ficha-datos>
        </app-ficha-seccion>

        <app-ficha-lateral titulo="Prerrequisitos">
            <!-- Cada condición es la frase que escribe la API («Criatura de tipo humanoide (conserva su tipo)»). -->
            <app-ficha-prerrequisitos [grupos]="prerrequisitosAgrupados" textoVacio="Sin prerrequisitos."></app-ficha-prerrequisitos>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Compatibilidad de tipo" *ngIf="compatibilidades.length > 0">
            <p class="ficha-nota">Tipo de la criatura base y tipo que pasa a tener.</p>
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let comp of compatibilidades">
                        <td>{{comp.tipoComp}}</td>
                        <td>{{comp.tipoNuevo}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Subtipos" *ngIf="subtipos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let subtipo of subtipos">
                    <button type="button" class="ficha-enlace" (click)="abrirDetalleSubtipo(subtipo)">{{subtipo.Nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Dotes" *ngIf="dotes.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let dote of dotes">
                    <button type="button" class="ficha-enlace" (click)="abrirDetallesDote(dote.contexto)">{{dote.nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Aptitudes sortílegas" *ngIf="sortilegas.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let sortilega of sortilegas">
                        <td><button type="button" class="ficha-enlace" (click)="abrirDetallesConjuro(sortilega.id)">{{sortilega.nombre}}</button></td>
                        <td>{{sortilega.detalle}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
