<app-ficha-detalle *ngIf="conjuro">
    <app-ficha-cabecera [icono]="iconoCabecera"
        [tipo]="tipoCabecera"
        [nombre]="conjuro.Nombre"
        [manual]="conjuro.Manual"
        [oficial]="conjuro.Oficial"
        [etiquetas]="etiquetas"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" [titulo]="conjuro.Psionico ? 'Datos del poder' : 'Datos del conjuro'"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="conjuro.Descripcion"></app-ficha-seccion>
        <app-ficha-seccion [titulo]="'Descripción de los ' + (tituloComponentes | lowercase)" [texto]="conjuro.Descripcion_componentes"></app-ficha-seccion>
        <app-ficha-seccion titulo="Descripción de los aumentos" [texto]="muestraAumentos ? conjuro.Descripcion_aumentos : null"></app-ficha-seccion>

        <app-ficha-lateral [titulo]="'Aptitud sortílega de ' + fuente" *ngIf="esSortilega">
            <app-ficha-datos [datos]="datosSortilega" [columnas]="2" [tarjeta]="false"></app-ficha-datos>
            <app-ficha-seccion titulo="Descripción" [texto]="ap.Descripcion"></app-ficha-seccion>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Nivel por clase" *ngIf="nivelesClaseVisibles.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let c of nivelesClaseVisibles">
                        <td>{{c.Clase}} <span class="ficha-nota" *ngIf="c.Espontaneo">(espontáneo)</span></td>
                        <td>{{c.Nivel}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Nivel por dominio" *ngIf="nivelesDominioVisibles.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let c of nivelesDominioVisibles">
                        <td>{{c.Dominio}} <span class="ficha-nota" *ngIf="c.Espontaneo">(espontáneo)</span></td>
                        <td>{{c.Nivel}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Nivel por disciplina" *ngIf="nivelesDisciplinaVisibles.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let c of nivelesDisciplinaVisibles">
                        <td>{{c.Disciplina}} <span class="ficha-nota" *ngIf="c.Espontaneo">(espontáneo)</span></td>
                        <td>{{c.Nivel}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
