<app-ficha-detalle *ngIf="arma">
    <app-ficha-cabecera icono="arma"
        [tipo]="tipoCabecera"
        [nombre]="arma.Nombre"
        [manual]="arma.Manual"
        [oficial]="arma.Oficial"
        [etiquetas]="etiquetas"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos del arma"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" *ngIf="conDescripcion">
            <app-descripcion-equipo [descripcion]="arma.Descripcion" [origen]="arma.Origen_descripcion"
                [nombreOriginal]="arma.Nombre_original" [traducido]="arma.Traducido">
            </app-descripcion-equipo>
        </app-ficha-seccion>

        <app-ficha-lateral titulo="Propiedades" *ngIf="propiedades.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let propiedad of propiedades">
                    <mat-icon class="ficha-icono" aria-hidden="true">check</mat-icon>
                    <div>
                        <div>{{propiedad.texto}}</div>
                        <p class="ficha-nota" *ngIf="propiedad.descripcion">{{propiedad.descripcion}}</p>
                    </div>
                </li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
