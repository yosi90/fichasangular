<app-ficha-detalle *ngIf="ventaja">
    <app-ficha-cabecera
        [tipo]="tipoCabecera"
        [nombre]="ventaja.Nombre"
        [manual]="ventaja.Manual"
        [oficial]="false"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" [titulo]="'Datos de la ' + (tipoCabecera | lowercase)"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="ventaja.Descripcion"></app-ficha-seccion>

        <app-ficha-lateral titulo="Afecta a" *ngIf="afectaA.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let materia of afectaA">{{materia}}</li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Efectos" *ngIf="efectos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let efecto of efectos">
                    <mat-icon class="ficha-icono" aria-hidden="true">check</mat-icon>
                    <span>{{efecto}}</span>
                </li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
