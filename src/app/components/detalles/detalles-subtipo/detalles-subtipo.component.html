<app-ficha-detalle *ngIf="subtipo">
    <app-ficha-cabecera
        tipo="Subtipo"
        [nombre]="subtipo.Nombre"
        [manual]="subtipo.Manual"
        [oficial]="subtipo.Oficial"
        [etiquetas]="etiquetas"
        (abrirManual)="abrirDetalleManual()">
    </app-ficha-cabecera>

    <app-ficha-datos [datos]="datos" titulo="Datos del subtipo"></app-ficha-datos>

    <app-ficha-cuerpo>
        <app-ficha-seccion titulo="Descripción" [texto]="subtipo.Descripcion"></app-ficha-seccion>
        <app-ficha-seccion titulo="Características" *ngIf="hayCaracteristicas">
            <app-ficha-caracteristicas [modificadores]="modificadoresCaracteristicas" [minimos]="minimosCaracteristicas"></app-ficha-caracteristicas>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Combate y defensas" *ngIf="combate.length > 0">
            <app-ficha-datos [datos]="combate" [columnas]="3" [tarjeta]="false" titulo="Combate y defensas"></app-ficha-datos>
        </app-ficha-seccion>
        <app-ficha-seccion titulo="Movimiento" *ngIf="movimiento.length > 0">
            <app-ficha-datos [datos]="movimiento" [columnas]="3" [tarjeta]="false" titulo="Movimiento"></app-ficha-datos>
        </app-ficha-seccion>

        <app-ficha-lateral titulo="Rasgos" *ngIf="rasgos.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let rasgo of rasgos">
                    <button type="button" class="ficha-enlace" (click)="abrirDetallesRasgo(rasgo)">{{rasgo.Nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Habilidades" *ngIf="habilidadesBase.length > 0 || habilidadesCustom.length > 0">
            <app-ficha-habilidades [base]="habilidadesBase" [custom]="habilidadesCustom"></app-ficha-habilidades>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Dotes" *ngIf="dotes.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let dote of dotes">
                    <button type="button" class="ficha-enlace" (click)="abrirDetallesDote(dote.contexto)">{{dote.nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Aptitudes sortílegas" *ngIf="sortilegas.length > 0">
            <table class="ficha-pares">
                <tbody>
                    <tr *ngFor="let sortilega of sortilegas">
                        <td><button type="button" class="ficha-enlace" (click)="abrirDetallesConjuro(sortilega.id)">{{sortilega.nombre}}</button></td>
                        <td>{{sortilega.detalle}}</td>
                    </tr>
                </tbody>
            </table>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Idiomas otorgados" *ngIf="idiomas.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let idioma of idiomas"
                    [matTooltip]="idioma.Descripcion" [matTooltipDisabled]="!idioma.Descripcion" matTooltipClass="tt-accent" [matTooltipShowDelay]="250">
                    {{idioma.Nombre}}
                </li>
            </ul>
        </app-ficha-lateral>

        <app-ficha-lateral titulo="Plantillas relacionadas" *ngIf="plantillas.length > 0">
            <ul class="ficha-lista">
                <li class="ficha-lista__item" *ngFor="let plantilla of plantillas">
                    <button type="button" class="ficha-enlace" (click)="abrirDetallesPlantilla(plantilla.Id)"
                        [matTooltip]="plantilla.Descripcion" [matTooltipDisabled]="!plantilla.Descripcion" matTooltipClass="tt-accent tt-multiline"
                        [matTooltipShowDelay]="250">{{plantilla.Nombre}}</button>
                </li>
            </ul>
        </app-ficha-lateral>
    </app-ficha-cuerpo>
</app-ficha-detalle>
