<div id="container-lista">
    <app-listado-cabecera icono="idioma" titulo="Idiomas" [total]="cargado && !errorCarga ? idiomasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar idiomas" placeholder="Buscar en el nombre o el texto">
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="idiomas" mat-table [dataSource]="idiomasDS" matSort aria-label="Idiomas">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let idioma">
                    <app-listado-nombre tipo="idioma" [nombre]="idioma.Nombre" (abrir)="verDetallesIdioma(idioma.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Secreto">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por secreto">Secreto</th>
                <td mat-cell *matCellDef="let idioma">
                    <mat-checkbox [checked]="idioma.Secreto === true" [disableRipple]="true" [attr.aria-label]="idioma.Secreto ? 'Secreto' : 'No secreto'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Oficial">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por oficial">Oficial</th>
                <td mat-cell *matCellDef="let idioma">
                    <mat-checkbox [checked]="idioma.Oficial === true" [disableRipple]="true" [attr.aria-label]="idioma.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="idiomaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let idioma; columns: idiomaColumns;" class="elegir" (click)="seleccionarIdioma(idioma.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="idiomaColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún idioma cumple los filtros.' : 'Aún no hay idiomas.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando idiomas"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los idiomas." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de idiomas"></mat-paginator>
</div>
