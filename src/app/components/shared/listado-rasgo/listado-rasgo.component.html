<div id="container-lista">
    <app-listado-cabecera icono="rasgo" titulo="Rasgos" [total]="cargado && !errorCarga ? rasgosDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar rasgos" placeholder="Buscar rasgos">
        <app-menu-filtros titulo="Filtros de rasgos" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarRasgosHomebrew();">{{anuncioRasgosHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="rasgos" mat-table [dataSource]="rasgosDS" matSort aria-label="Rasgos">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let rasgo">
                    <app-listado-nombre tipo="rasgo" [nombre]="rasgo.Nombre" (abrir)="verDetallesRasgo(rasgo.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let rasgo">
                    <mat-checkbox [checked]="!rasgo.Oficial" [disableRipple]="true" [attr.aria-label]="rasgo.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="rasgoColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let rasgo; columns: rasgoColumns;" class="elegir" (click)="seleccionarRasgo(rasgo.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="rasgoColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún rasgo cumple los filtros.' : 'Aún no hay rasgos.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando rasgos"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los rasgos." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de rasgos"></mat-paginator>
</div>
