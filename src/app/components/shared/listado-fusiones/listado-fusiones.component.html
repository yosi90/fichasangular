<div id="container-lista" class="tw-w-full tw-bg-[#212529] tw-h-full">
    <div class="lista-row tw-w-full tw-relative tw-flex tw-justify-center tw-items-center">
        <app-menu-filtros titulo="Filtros de fusiones">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field (keyup)="filtroFusiones();">
                    <mat-label>Buscar fusión</mat-label>
                    <input #fusionTextInc matInput placeholder="En español o en inglés">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Clase</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultClase" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let clase of clases" [value]="clase">{{clase}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Chakra</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultChakra" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let chakra of chakras" [value]="chakra">{{chakra}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Descriptor</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultDescriptor" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let descriptor of descriptores" [value]="descriptor">{{descriptor}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroFusiones()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="homebrewActivo"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>

        <table id="fusiones" mat-table [dataSource]="fusionesDS" matSort *ngIf="fusiones.length > 0; else cargando">
            <ng-container matColumnDef="{{column}}" *ngFor="let column of fusionColumns">
                <th class="tw-text-lg tw-font-medium" mat-header-cell *matHeaderCellDef mat-sort-header
                    sortActionDescription="Ordenar por {{titulosColumnas[column]}}">
                    {{titulosColumnas[column]}}
                </th>
                <td mat-cell *matCellDef="let fila">
                    <button mat-stroked-button matTooltip="Clic para ver esta fusión" [matTooltipShowDelay]="200"
                        *ngIf="column == 'Nombre'" color="accent" class="tw-flex tw-justify-start sombra3d tw-w-full"
                        (click)="verDetallesFusion(fila); $event.stopPropagation();">
                        <mat-icon>read_more</mat-icon>
                        {{fila.Nombre}}
                        <span class="nombre-original" *ngIf="fila.Original">{{fila.Original}}</span>
                    </button>
                    <button type="button" class="manual-clickable" *ngIf="column == 'Manual'"
                        (click)="abrirDetalleManual(fila, $event)">{{fila.Manual}}</button>
                    <span *ngIf="column != 'Nombre' && column != 'Manual'">{{fila[column] || '—'}}</span>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="fusionColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let fila; columns: fusionColumns;" class="element-row elegir"
                (click)="seleccionarFusion(fila)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell tw-text-center tw-text-white tw-p-3" [attr.colspan]="fusionColumns.length">
                    Ninguna fusión encaja con los filtros
                </td>
            </tr>
        </table>
        <ng-template #cargando>
            <div class="superballs">
                <div class="superballs__dot"></div>
                <div class="superballs__dot"></div>
            </div>
        </ng-template>
    </div>
    <div class="lista-row tw-w-full tw-flex tw-items-center">
        <mat-paginator class="tw-w-full" [pageSizeOptions]="[10, 20, 30, 40]" showFirstLastButtons
            aria-label="Selecciona una página de fusiones">
        </mat-paginator>
    </div>
</div>
