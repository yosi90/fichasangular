<div id="container-lista">
    <app-listado-cabecera icono="fusion" titulo="Fusiones del alma" [total]="cargado && !errorCarga ? fusionesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar fusiones" placeholder="En español o en inglés">
        <app-menu-filtros titulo="Filtros de fusiones" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field>
                    <mat-label>Clase</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultClase" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let clase of clases" [value]="clase">{{clase}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Chakra</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultChakra" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let chakra of chakras" [value]="chakra">{{chakra}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Descriptor</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultDescriptor" (selectionChange)="filtroFusiones();">
                        <mat-option *ngFor="let descriptor of descriptores" [value]="descriptor">{{descriptor}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroFusiones()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="homebrewActivo"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="fusiones" mat-table [dataSource]="fusionesDS" matSort aria-label="Fusiones del alma">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por fusión">Fusión</th>
                <td mat-cell *matCellDef="let fila">
                    <app-listado-nombre tipo="fusion" [nombre]="fila.Nombre" [original]="fila.Original" (abrir)="verDetallesFusion(fila)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Clases">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por clases">Clases</th>
                <td mat-cell *matCellDef="let fila">{{fila.Clases || '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Se_moldea">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por dónde se moldea">Se moldea en</th>
                <td mat-cell *matCellDef="let fila">{{fila.Se_moldea || '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Vinculos">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por vínculos">Vínculos</th>
                <td mat-cell *matCellDef="let fila">{{fila.Vinculos || '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Descriptores">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por descriptores">Descriptores</th>
                <td mat-cell *matCellDef="let fila">{{fila.Descriptores || '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let fila">
                    <app-listado-manual [manual]="fila.fusion.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="fusionColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let fila; columns: fusionColumns;" class="elegir" (click)="seleccionarFusion(fila)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="fusionColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna fusión cumple los filtros.' : 'Aún no hay fusiones.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando fusiones"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las fusiones." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de fusiones"></mat-paginator>
</div>
