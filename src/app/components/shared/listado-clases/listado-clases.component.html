<div id="container-lista">
    <app-listado-cabecera icono="clase" titulo="Clases" [total]="cargado && !errorCarga ? clasesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar clases" placeholder="Buscar en el nombre o la descripción">
        <app-menu-filtros titulo="Filtros de clases" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [includeAny]="false"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroClases()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="incluirHomebrew"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
                <mat-chip-option color="accent" class="filtro-chip" [selected]="soloPrestigio"
                    (click)="alternarPrestigio();">{{anuncioPrestigio}}</mat-chip-option>
                <mat-chip-option color="accent" class="filtro-chip" [selected]="ocultarConPrerrequisitos"
                    (click)="alternarFiltroPrerrequisitos();">{{anuncioPrerrequisitos}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="clases" mat-table [dataSource]="clasesDS" matSort aria-label="Clases">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let clase">
                    <app-listado-nombre [tipo]="tipoDe(clase)" [nombre]="clase.Nombre" (abrir)="verDetallesClase(clase.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let clase">
                    <button type="button" class="listado-manual" (click)="abrirDetalleManual(clase, $event)">{{clase.Manual | manualListado}}</button>
                </td>
            </ng-container>
            <ng-container matColumnDef="Tipo_dado">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por dado de golpe">Dado de golpe</th>
                <td mat-cell *matCellDef="let clase">{{clase.Tipo_dado?.Nombre}}</td>
            </ng-container>
            <ng-container matColumnDef="Puntos_habilidad">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por puntos de habilidad">Puntos de habilidad</th>
                <td mat-cell *matCellDef="let clase">{{clase.Puntos_habilidad?.Valor}}</td>
            </ng-container>
            <ng-container matColumnDef="Nivel_max_claseo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nivel máximo">Nivel máximo</th>
                <td mat-cell *matCellDef="let clase">{{clase.Nivel_max_claseo}}</td>
            </ng-container>
            <ng-container matColumnDef="Prestigio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por prestigio">De prestigio</th>
                <td mat-cell *matCellDef="let clase">
                    <mat-checkbox [checked]="clase.Prestigio" [disableRipple]="true" [attr.aria-label]="clase.Prestigio ? 'De prestigio' : 'Básica'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Prerrequisitos">
                <th mat-header-cell *matHeaderCellDef>Prerrequisitos</th>
                <td mat-cell *matCellDef="let clase">
                    <mat-checkbox [checked]="tienePrerrequisitos(clase)" [disableRipple]="true"
                        [attr.aria-label]="tienePrerrequisitos(clase) ? 'Con prerrequisitos' : 'Sin prerrequisitos'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="claseColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let clase; columns: claseColumns;" class="elegir" (click)="seleccionarClase(clase.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="claseColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna clase cumple los filtros.' : 'Aún no hay clases.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando clases"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las clases." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de clases"></mat-paginator>
</div>
