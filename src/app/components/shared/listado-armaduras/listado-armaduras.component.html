<div id="container-lista">
    <app-listado-cabecera icono="armadura" titulo="Armaduras y escudos" [total]="cargado && !errorCarga ? armadurasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar armaduras y escudos" placeholder="Buscar en el nombre o el texto">
        <app-menu-filtros titulo="Filtros de armaduras" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroArmaduras()">
                </app-manual-autocomplete>
                <mat-form-field>
                    <mat-label>Categoría</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultTipoArmadura" (selectionChange)="filtroArmaduras();">
                        <mat-option *ngFor="let tipo of tiposArmadura" [value]="tipo">{{tipo}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="accent" class="filtro-chip" [selected]="soloEscudos"
                    (click)="alternarSoloEscudos();">Solo escudos</mat-chip-option>
                <mat-chip-option color="warn" class="filtro-chip" [selected]="homebrewActivo"
                    (click)="AlternarArmadurasHombrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="armaduras" mat-table [dataSource]="armadurasDS" matSort aria-label="Armaduras y escudos">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let armadura">
                    <app-listado-nombre tipo="armadura" [nombre]="armadura.Nombre" (abrir)="verDetallesArmadura(armadura.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let armadura">
                    <app-listado-manual *ngIf="armadura.Manual?.Nombre" [manual]="armadura.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Categoria">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por categoría">Categoría</th>
                <td mat-cell *matCellDef="let armadura">{{getCategoria(armadura)}}</td>
            </ng-container>
            <ng-container matColumnDef="Bon_des">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por Destreza máxima">Destreza máx.</th>
                <td mat-cell *matCellDef="let armadura">{{getDestrezaMaxima(armadura)}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="armaduraColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let armadura; columns: armaduraColumns;" class="elegir" (click)="seleccionarArmadura(armadura.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="armaduraColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna armadura cumple los filtros.' : 'Aún no hay armaduras.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando armaduras"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las armaduras." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de armaduras"></mat-paginator>
</div>
