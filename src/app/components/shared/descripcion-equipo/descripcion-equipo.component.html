<app-texto-manual class="ficha-texto" *ngIf="tieneDescripcion" [texto]="descripcion"></app-texto-manual>
<p class="ficha-nota" *ngIf="visible">
    <span *ngIf="tieneDescripcion" [matTooltip]="ayudaOrigen" matTooltipClass="tt-accent tt-multiline">{{textoOrigen}}</span>
    <ng-container *ngIf="tieneDescripcion && traducido"> · </ng-container>
    <span *ngIf="traducido" matTooltip="Viene de un libro en inglés, traducido por nosotros" matTooltipClass="tt-accent">
        Traducido<ng-container *ngIf="tieneNombreOriginal">: {{nombreOriginal}}</ng-container>
    </span>
</p>
