<div id="container-lista">
    <app-listado-cabecera icono="especial" titulo="Especiales" [total]="cargado && !errorCarga ? especialesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar especiales" placeholder="Buscar en el nombre o la descripción">
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="especiales" mat-table [dataSource]="especialesDS" matSort aria-label="Especiales">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let especial">
                    <app-listado-nombre tipo="especial" [nombre]="especial.Nombre" (abrir)="verDetallesEspecial(especial.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container *ngFor="let casilla of casillas" [matColumnDef]="casilla.columna">
                <th mat-header-cell *matHeaderCellDef mat-sort-header [sortActionDescription]="'Ordenar por ' + casilla.etiqueta">{{casilla.etiqueta}}</th>
                <td mat-cell *matCellDef="let especial">
                    <mat-checkbox [checked]="!!especial[casilla.columna]" [disableRipple]="true"
                        [attr.aria-label]="casilla.etiqueta + (especial[casilla.columna] ? ': sí' : ': no')"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="especialColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let especial; columns: especialColumns;" class="elegir" (click)="seleccionarEspecial(especial.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="especialColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún especial cumple la búsqueda.' : 'Aún no hay especiales.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando especiales"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los especiales." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de especiales"></mat-paginator>
</div>
