<div id="container-lista">
    <app-listado-cabecera icono="tipo-criatura" titulo="Tipos de criatura" [total]="cargado && !errorCarga ? tiposDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar tipos de criatura" placeholder="Buscar tipos de criatura">
        <app-menu-filtros titulo="Filtros de tipos" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="Manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroTipos()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarTiposHomebrew();">{{anuncioTiposHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="tipos" mat-table [dataSource]="tiposDS" matSort aria-label="Tipos de criatura">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let tipo">
                    <app-listado-nombre tipo="tipo-criatura" [nombre]="tipo.Nombre" (abrir)="verDetallesTipo(tipo.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let tipo">
                    <app-listado-manual [manual]="tipo.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let tipo">
                    <mat-checkbox [checked]="!tipo.Oficial" [disableRipple]="true" [attr.aria-label]="tipo.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="tipoColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let tipo; columns: tipoColumns;" class="elegir" (click)="seleccionarTipo(tipo.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="tipoColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún tipo cumple los filtros.' : 'Aún no hay tipos de criatura.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando tipos de criatura"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los tipos de criatura." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de tipos de criatura"></mat-paginator>
</div>
