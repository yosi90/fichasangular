<div id="container-lista">
    <app-listado-cabecera icono="subtipo" titulo="Subtipos" [total]="cargado && !errorCarga ? subtiposDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar subtipos" placeholder="Buscar subtipos">
        <app-menu-filtros titulo="Filtros de subtipos" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroSubtipos()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarSubtiposHomebrew();">{{anuncioSubtiposHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="subtipos" mat-table [dataSource]="subtiposDS" matSort aria-label="Subtipos">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let subtipo">
                    <app-listado-nombre tipo="subtipo" [nombre]="subtipo.Nombre" (abrir)="verDetallesSubtipo(subtipo.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let subtipo">
                    <app-listado-manual [manual]="subtipo.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Heredada">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por heredada">Heredada</th>
                <td mat-cell *matCellDef="let subtipo">
                    <mat-checkbox [checked]="!!subtipo.Heredada" [disableRipple]="true" [attr.aria-label]="subtipo.Heredada ? 'Heredada' : 'No heredada'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let subtipo">
                    <mat-checkbox [checked]="!subtipo.Oficial" [disableRipple]="true" [attr.aria-label]="subtipo.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="subtipoColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let subtipo; columns: subtipoColumns;" class="elegir" (click)="seleccionarSubtipo(subtipo.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="subtipoColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún subtipo cumple los filtros.' : 'Aún no hay subtipos.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando subtipos"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los subtipos." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de subtipos"></mat-paginator>
</div>
