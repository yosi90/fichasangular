<div id="container-lista" class="tw-w-full tw-bg-[#212529] tw-h-full">
    <div class="lista-row tw-w-full tw-relative tw-flex tw-justify-center tw-items-center">
        <button matTooltip="Filtros" mat-icon-button aria-label="Filtros" [matMenuTriggerFor]="menuFiltros" class="filtros">
            <mat-icon>filter_alt</mat-icon>
        </button>
        <mat-menu #menuFiltros="matMenu" class="tw-me-1 menu-filtros-estandar menu-equipo-filtros">
            <div id="menu">
                <mat-form-field appearance="fill" (click)="$event.stopPropagation();" (keyup)="filtrar();">
                    <mat-label>Incluye texto</mat-label>
                    <input #textoInc matInput placeholder="Texto a buscar">
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtrar()">
                </app-manual-autocomplete>
            </div>
            <div class="filtros-chips">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="$event.stopPropagation(); alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </div>
        </mat-menu>

        <table mat-table [dataSource]="dataSource" matSort *ngIf="cargado; else cargando">
            <ng-container [matColumnDef]="columna" *ngFor="let columna of columnas">
                <th class="tw-text-lg tw-font-medium" mat-header-cell *matHeaderCellDef mat-sort-header
                    sortActionDescription="Ordenar por {{etiquetaColumna(columna)}}">
                    {{etiquetaColumna(columna)}}
                </th>
                <td mat-cell *matCellDef="let item">
                    <button mat-stroked-button matTooltip="Clic para ver los detalles" [matTooltipShowDelay]="200"
                        *ngIf="columna === 'Nombre'" color="accent" class="tw-flex tw-justify-start sombra3d tw-w-full"
                        (click)="verDetalles(item); $event.stopPropagation();">
                        <mat-icon>read_more</mat-icon>
                        {{item.Nombre}}
                    </button>
                    <button type="button" class="manual-clickable" *ngIf="columna === 'Manual'"
                        (click)="abrirDetalleManual(item, $event)">
                        {{manualVisible(item)}}
                    </button>
                    <span *ngIf="columna !== 'Nombre' && columna !== 'Manual'">{{valorColumna(item, columna)}}</span>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
            <tr mat-row *matRowDef="let item; columns: columnas;" class="element-row elegir" (click)="seleccionar(item)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell tw-text-center tw-text-white tw-p-3" [attr.colspan]="columnas.length">
                    {{items.length > 0 ? 'Nada encaja con los filtros' : 'Todavía no hay ' + configuracion.plural + ' en el catálogo'}}
                </td>
            </tr>
        </table>
        <ng-template #cargando>
            <div class="superballs">
                <div class="superballs__dot"></div>
                <div class="superballs__dot"></div>
            </div>
        </ng-template>
    </div>
    <div class="lista-row tw-w-full tw-flex tw-items-center">
        <mat-paginator class="tw-w-full" [pageSizeOptions]="[10, 20, 30, 40]" showFirstLastButtons
            aria-label="Selecciona una página">
        </mat-paginator>
    </div>
</div>
