<div id="container-lista">
    <app-listado-cabecera [icono]="icono" [titulo]="titulo" [total]="cargado && !errorCarga ? dataSource.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" [etiquetaBuscar]="'Buscar ' + configuracion.plural"
        placeholder="Buscar en el nombre o el texto">
        <app-menu-filtros [titulo]="'Filtros de ' + configuracion.plural" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtrar()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table mat-table [dataSource]="dataSource" matSort [attr.aria-label]="titulo">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let item">
                    <app-listado-nombre [tipo]="icono" [nombre]="item.Nombre" [original]="nombreOriginal(item)" (abrir)="verDetalles(item)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let item">
                    <app-listado-manual [manual]="item.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container *ngFor="let columna of configuracion.columnas" [matColumnDef]="columna.clave">
                <th mat-header-cell *matHeaderCellDef mat-sort-header [sortActionDescription]="'Ordenar por ' + columna.etiqueta">{{columna.etiqueta}}</th>
                <td mat-cell *matCellDef="let item">{{columna.valor(item)}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
            <tr mat-row *matRowDef="let item; columns: columnas;" class="elegir" (click)="seleccionar(item)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="columnas.length">
                    <app-listado-estado tipo="vacio"
                        [mensaje]="hayFiltros ? 'Nada cumple los filtros.' : 'Todavía no hay ' + configuracion.plural + ' en el catálogo.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" [etiqueta]="'Cargando ' + configuracion.plural"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" [mensaje]="'No se pudo cargar la lista de ' + configuracion.plural + '.'"
        (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" [attr.aria-label]="'Páginas de ' + configuracion.plural"></mat-paginator>
</div>
