<div id="container-lista">
    <app-listado-cabecera icono="ventaja" titulo="Ventajas y desventajas" [total]="cargado && !errorCarga ? ventajasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar ventajas y desventajas" placeholder="Buscar ventajas y desventajas">
        <app-menu-filtros titulo="Filtros de ventajas y desventajas" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroVentajas()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="ventajas" mat-table [dataSource]="ventajasDS" matSort aria-label="Ventajas y desventajas">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let ventaja">
                    <app-listado-nombre [tipo]="tipoDe(ventaja)" [nombre]="ventaja.Nombre" (abrir)="verDetallesVentaja(ventaja)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Tipo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por tipo">Tipo</th>
                <td mat-cell *matCellDef="let ventaja">{{ventaja.Tipo}}</td>
            </ng-container>
            <ng-container matColumnDef="Coste">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por coste">Coste</th>
                <td mat-cell *matCellDef="let ventaja">{{ventaja.Coste > 0 ? '+' : ''}}{{ventaja.Coste}}</td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let ventaja">
                    <app-listado-manual *ngIf="ventaja.Manual?.Nombre" [manual]="ventaja.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="ventajaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let ventaja; columns: ventajaColumns;" class="elegir" (click)="seleccionarVentaja(ventaja)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="ventajaColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna ventaja ni desventaja cumple los filtros.' : 'Aún no hay ventajas ni desventajas.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando ventajas y desventajas"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las ventajas y desventajas." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de ventajas y desventajas"></mat-paginator>
</div>
