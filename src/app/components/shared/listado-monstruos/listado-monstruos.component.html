<div id="container-lista">
    <app-listado-cabecera icono="monstruo" titulo="Monstruos" [total]="cargado && !errorCarga ? monstruosDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar monstruos" placeholder="Buscar monstruos">
        <app-menu-filtros titulo="Filtros de monstruos" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="Manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroMonstruos()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip"
                    [selected]="homebrewActivo"
                    (click)="AlternarMonstruosHombrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="monstruos" mat-table [dataSource]="monstruosDS" matSort aria-label="Monstruos">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let monstruo">
                    <app-listado-nombre tipo="monstruo" [nombre]="monstruo.Nombre" (abrir)="verDetallesMonstruo(monstruo.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let monstruo">
                    <app-listado-manual *ngIf="monstruo.Manual?.Nombre" [manual]="monstruo.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Valor_desafio">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por valor de desafío">VD</th>
                <td mat-cell *matCellDef="let monstruo">
                    <span class="dato-chip sombra3d-sm neutral" *ngIf="monstruo.Valor_desafio"><span class="solo-lectores">Valor de desafío </span>{{monstruo.Valor_desafio}}</span>
                </td>
            </ng-container>
            <ng-container matColumnDef="Familiar">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por familiar">Familiar</th>
                <td mat-cell *matCellDef="let monstruo">
                    <mat-checkbox [checked]="isFlagActiva(monstruo.Familiar)" [disableRipple]="true"
                        [attr.aria-label]="isFlagActiva(monstruo.Familiar) ? 'Puede ser familiar' : 'No puede ser familiar'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Companero">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por compañero">Compañero</th>
                <td mat-cell *matCellDef="let monstruo">
                    <mat-checkbox [checked]="isFlagActiva(monstruo.Companero)" [disableRipple]="true"
                        [attr.aria-label]="isFlagActiva(monstruo.Companero) ? 'Puede ser compañero' : 'No puede ser compañero'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let monstruo">
                    <mat-checkbox [checked]="!monstruo.Oficial" [disableRipple]="true" [attr.aria-label]="monstruo.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="monstruoColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let monstruo; columns: monstruoColumns;" class="elegir" (click)="seleccionarMonstruo(monstruo.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="monstruoColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún monstruo cumple los filtros.' : 'Aún no hay monstruos.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando monstruos"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los monstruos." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de monstruos"></mat-paginator>
</div>
