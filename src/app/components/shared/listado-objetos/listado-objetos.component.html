<div id="container-lista" class="tw-w-full tw-bg-[#212529] tw-h-full">
    <div class="lista-row tw-w-full tw-relative tw-flex tw-justify-center tw-items-center">
        <app-menu-filtros titulo="Filtros de objetos">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field appearance="fill">
                    <mat-label>Incluye texto</mat-label>
                    <input matInput placeholder="Nombre a buscar" [value]="texto" (input)="alCambiarTexto($any($event.target).value)">
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Categoría</mat-label>
                    <mat-select [(value)]="categoria" (selectionChange)="alCambiarFiltro()">
                        <mat-option *ngFor="let opcion of categorias" [value]="opcion.valor">{{opcion.etiqueta}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Tipo de objeto</mat-label>
                    <mat-select [(value)]="idTipo" (selectionChange)="alCambiarFiltro()">
                        <mat-option [value]="null">Cualquiera</mat-option>
                        <mat-option *ngFor="let tipo of tiposVisibles" [value]="tipo.Id">{{tipo.Nombre}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Ranura</mat-label>
                    <mat-select [(value)]="idRanura" (selectionChange)="alCambiarFiltro()">
                        <mat-option [value]="null">Cualquiera</mat-option>
                        <mat-option *ngFor="let ranura of ranuras" [value]="ranura.Id">{{ranura.Nombre}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    valueMode="id"
                    [(value)]="manual"
                    (selectionChange)="alCambiarFiltro()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
        </app-menu-filtros>

        <div class="tw-w-full tw-p-3 tw-text-center bloque-error" *ngIf="error">{{error}}</div>
        <table mat-table [dataSource]="objetos" *ngIf="!cargando || objetos.length > 0; else cargandoTpl">
            <ng-container [matColumnDef]="columna" *ngFor="let columna of columnas">
                <th class="tw-text-lg tw-font-medium" mat-header-cell *matHeaderCellDef>{{columna}}</th>
                <td mat-cell *matCellDef="let objeto">
                    <button mat-stroked-button matTooltip="Clic para ver este objeto" [matTooltipShowDelay]="200"
                        *ngIf="columna === 'Nombre'" color="accent" class="tw-flex tw-justify-start sombra3d tw-w-full"
                        (click)="verDetalles(objeto); $event.stopPropagation();">
                        <mat-icon>read_more</mat-icon>
                        {{objeto.Nombre}}
                    </button>
                    <button type="button" class="manual-clickable" *ngIf="columna === 'Manual'"
                        (click)="abrirDetalleManual(objeto, $event)">
                        {{manualVisible(objeto)}}
                    </button>
                    <span *ngIf="columna === 'Tipo'">{{objeto.Tipo?.Nombre}}</span>
                    <span *ngIf="columna === 'Ranura'">{{objeto.Ranura?.Nombre ?? '—'}}</span>
                    <span *ngIf="columna === 'Precio'">{{precioVisible(objeto)}}</span>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
            <tr mat-row *matRowDef="let objeto; columns: columnas;" class="element-row elegir" (click)="seleccionar(objeto)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell tw-text-center tw-text-white tw-p-3" [attr.colspan]="columnas.length">
                    Ningún objeto encaja con los filtros
                </td>
            </tr>
        </table>
        <ng-template #cargandoTpl>
            <div class="superballs">
                <div class="superballs__dot"></div>
                <div class="superballs__dot"></div>
            </div>
        </ng-template>
    </div>
    <div class="lista-row tw-w-full tw-flex tw-items-center">
        <mat-paginator class="tw-w-full" [length]="total" [pageIndex]="pagina" [pageSize]="porPagina"
            [pageSizeOptions]="opcionesPorPagina" showFirstLastButtons (page)="alCambiarPagina($event)"
            aria-label="Selecciona una página de objetos">
        </mat-paginator>
    </div>
</div>
