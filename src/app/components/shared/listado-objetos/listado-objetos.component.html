<div id="container-lista">
    <app-listado-cabecera icono="objeto" titulo="Objetos" [total]="cargado && !error ? total : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar objetos" placeholder="Buscar objetos">
        <app-menu-filtros titulo="Filtros de objetos" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field appearance="fill">
                    <mat-label>Categoría</mat-label>
                    <mat-select [(value)]="categoria" (selectionChange)="alCambiarFiltro()">
                        <mat-option *ngFor="let opcion of categorias" [value]="opcion.valor">{{opcion.etiqueta}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Tipo de objeto</mat-label>
                    <mat-select [(value)]="idTipo" (selectionChange)="alCambiarFiltro()">
                        <mat-option [value]="null">Cualquiera</mat-option>
                        <mat-option *ngFor="let tipo of tiposVisibles" [value]="tipo.Id">{{tipo.Nombre}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="fill">
                    <mat-label>Ranura</mat-label>
                    <mat-select [(value)]="idRanura" (selectionChange)="alCambiarFiltro()">
                        <mat-option [value]="null">Cualquiera</mat-option>
                        <mat-option *ngFor="let ranura of ranuras" [value]="ranura.Id">{{ranura.Nombre}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    valueMode="id"
                    [(value)]="manual"
                    (selectionChange)="alCambiarFiltro()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || !!error">
        <table mat-table [dataSource]="objetos" aria-label="Objetos">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let objeto">
                    <app-listado-nombre tipo="objeto" [nombre]="objeto.Nombre" [original]="nombreOriginal(objeto)" (abrir)="verDetalles(objeto)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef>Manual</th>
                <td mat-cell *matCellDef="let objeto">
                    <app-listado-manual [manual]="objeto.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Tipo">
                <th mat-header-cell *matHeaderCellDef>Tipo</th>
                <td mat-cell *matCellDef="let objeto">{{objeto.Tipo?.Nombre}}</td>
            </ng-container>
            <ng-container matColumnDef="Ranura">
                <th mat-header-cell *matHeaderCellDef>Ranura</th>
                <td mat-cell *matCellDef="let objeto">{{objeto.Ranura?.Nombre ?? '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Precio">
                <th mat-header-cell *matHeaderCellDef>Precio</th>
                <td mat-cell *matCellDef="let objeto">{{precioVisible(objeto)}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columnas; sticky: true"></tr>
            <tr mat-row *matRowDef="let objeto; columns: columnas;" class="elegir" (click)="seleccionar(objeto)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="columnas.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún objeto cumple los filtros.' : 'Aún no hay objetos.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado && !error" tipo="cargando" etiqueta="Cargando objetos"></app-listado-estado>
    <app-listado-estado *ngIf="error" tipo="error" [mensaje]="error" (accion)="reintentar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || !!error" [length]="total" [pageIndex]="pagina"
        [pageSize]="porPagina" (page)="alCambiarPagina($event)" aria-label="Páginas de objetos">
    </mat-paginator>
</div>
