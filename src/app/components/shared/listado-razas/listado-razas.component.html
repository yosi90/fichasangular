<div id="container-lista">
    <app-listado-cabecera icono="raza" titulo="Razas" [total]="cargado && !errorCarga ? razasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar razas" placeholder="Buscar razas">
        <app-menu-filtros titulo="Filtros de razas" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="Manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroRazas()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip"
                    [selected]="homebrewActivo"
                    [disabled]="homebrewBloqueado"
                    (click)="AlternarRazasHombrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="razas" mat-table [dataSource]="razasDS" matSort aria-label="Razas">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let raza">
                    <app-listado-nombre tipo="raza" [nombre]="raza.Nombre" [original]="nombreOriginal(raza)"
                        [expandido]="vistaPrevia ? razaAbiertaId === raza.Id : null" [controla]="vistaPrevia ? 'creacion-vista-previa' : null"
                        (abrir)="verDetallesRaza(raza.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Modificadores">
                <th mat-header-cell *matHeaderCellDef>Modificadores</th>
                <td mat-cell *matCellDef="let raza">
                    <span class="modificadores-celda">
                        <span class="dato-chip sombra3d-sm" *ngFor="let mod of modificadoresVisibles(raza.Modificadores)"
                            [ngClass]="mod.valor > 0 ? 'good' : 'bad'">{{mod.texto}}</span>
                    </span>
                </td>
            </ng-container>
            <ng-container matColumnDef="Clase_predilecta">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por clase predilecta">Clase predilecta</th>
                <td mat-cell *matCellDef="let raza">{{raza.Clase_predilecta}}</td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let raza">
                    <app-listado-manual [manual]="raza.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Ajuste_nivel">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por ajuste de nivel">Ajuste</th>
                <td mat-cell *matCellDef="let raza">
                    <span *ngIf="raza.Ajuste_nivel > 0"><span class="solo-lectores">Ajuste de nivel </span>+{{raza.Ajuste_nivel}}</span>
                </td>
            </ng-container>
            <ng-container matColumnDef="Dgs_adicionales">
                <th mat-header-cell *matHeaderCellDef>DG raciales</th>
                <td mat-cell *matCellDef="let raza">
                    <span *ngIf="getDgsCantidad(raza.Dgs_adicionales) > 0">{{getDgsCantidad(raza.Dgs_adicionales)}}{{getDgsDado(raza.Dgs_adicionales)}}<span class="solo-lectores"> raciales</span></span>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let raza">
                    <mat-checkbox [checked]="!raza.Oficial" [disableRipple]="true" [attr.aria-label]="raza.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="razaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let raza; columns: razaColumns;" class="elegir"
                [class.creacion-fila-abrible]="vistaPrevia" [class.creacion-fila-abierta]="vistaPrevia && razaAbiertaId === raza.Id"
                (click)="pulsarFila(raza.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="razaColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna raza cumple los filtros.' : 'Aún no hay razas.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando razas"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las razas." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de razas"></mat-paginator>
</div>
