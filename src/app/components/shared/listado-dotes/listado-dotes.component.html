<div id="container-lista">
    <app-listado-cabecera icono="dote" titulo="Dotes" [total]="cargado && !errorCarga ? dotesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar dotes" placeholder="Buscar en el nombre o el texto">
        <app-menu-filtros titulo="Filtros de dotes" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [includeAny]="false"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroDotes()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarDotesHomebrew();">{{anuncioDotesHomebrew}}</mat-chip-option>
                <mat-chip-option color="accent" class="filtro-chip" [selected]="soloSinPrerrequisitos"
                    (click)="alternarSinPrerrequisitos();">{{anuncioSinPrerrequisitos}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="dotes" mat-table [dataSource]="dotesDS" matSort aria-label="Dotes">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let dote">
                    <app-listado-nombre tipo="dote" [nombre]="dote.Nombre" [original]="nombreOriginal(dote)" (abrir)="verDetallesDote(dote.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let dote">
                    <button type="button" class="listado-manual" (click)="abrirDetalleManual(dote, $event)">{{dote.Manual | manualListado}}</button>
                </td>
            </ng-container>
            <ng-container matColumnDef="Tipos">
                <th mat-header-cell *matHeaderCellDef>Tipos</th>
                <td mat-cell *matCellDef="let dote">{{getTipos(dote)}}</td>
            </ng-container>
            <ng-container matColumnDef="Prerrequisitos">
                <th mat-header-cell *matHeaderCellDef>Prerrequisitos</th>
                <td mat-cell *matCellDef="let dote">
                    <mat-checkbox [checked]="tienePrerrequisitos(dote)" [disableRipple]="true"
                        [attr.aria-label]="tienePrerrequisitos(dote) ? 'Con prerrequisitos' : 'Sin prerrequisitos'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let dote">
                    <mat-checkbox [checked]="!dote.Oficial" [disableRipple]="true" [attr.aria-label]="dote.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="doteColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let dote; columns: doteColumns;" class="elegir" (click)="seleccionarDote(dote.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="doteColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna dote cumple los filtros.' : 'Aún no hay dotes.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando dotes"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las dotes." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de dotes"></mat-paginator>
</div>
