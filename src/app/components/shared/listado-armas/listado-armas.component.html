<div id="container-lista">
    <app-listado-cabecera icono="arma" titulo="Armas" [total]="cargado && !errorCarga ? armasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar armas" placeholder="Buscar en el nombre o el texto">
        <app-menu-filtros titulo="Filtros de armas" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroArmas()">
                </app-manual-autocomplete>
                <mat-form-field>
                    <mat-label>Tipo de arma</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultTipoArma" (selectionChange)="filtroArmas();">
                        <mat-option *ngFor="let tipo of tiposArma" [value]="tipo">{{tipo}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip"
                    [selected]="homebrewActivo"
                    (click)="AlternarArmasHombrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="armas" mat-table [dataSource]="armasDS" matSort aria-label="Armas">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let arma">
                    <app-listado-nombre tipo="arma" [nombre]="arma.Nombre" (abrir)="verDetallesArma(arma.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let arma">
                    <app-listado-manual *ngIf="arma.Manual?.Nombre" [manual]="arma.Manual"></app-listado-manual>
                </td>
            </ng-container>
            <ng-container matColumnDef="Tipo_arma">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por tipo de arma">Tipo de arma</th>
                <td mat-cell *matCellDef="let arma">{{arma.Tipo_arma?.Nombre}}</td>
            </ng-container>
            <ng-container matColumnDef="Tipo_dano">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por tipo de daño">Tipo de daño</th>
                <td mat-cell *matCellDef="let arma">{{arma.Tipo_dano?.Nombre}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="armaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let arma; columns: armaColumns;" class="elegir" (click)="seleccionarArma(arma.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="armaColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún arma cumple los filtros.' : 'Aún no hay armas.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando armas"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las armas." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de armas"></mat-paginator>
</div>
