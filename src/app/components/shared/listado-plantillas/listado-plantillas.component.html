<div id="container-lista">
    <app-listado-cabecera icono="plantilla" titulo="Plantillas" [total]="cargado && !errorCarga ? plantillasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar plantillas" placeholder="Buscar en el nombre o la descripción">
        <app-menu-filtros titulo="Filtros de plantillas" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [includeAny]="false"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroPlantillas()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="incluirHomebrew"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="plantillas" mat-table [dataSource]="plantillasDS" matSort aria-label="Plantillas">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let plantilla">
                    <app-listado-nombre tipo="plantilla" [nombre]="plantilla.Nombre" [original]="nombreOriginal(plantilla)"
                        (abrir)="verDetallesPlantilla(plantilla.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let plantilla">
                    <button type="button" class="listado-manual" (click)="abrirDetalleManual(plantilla, $event)">{{plantilla.Manual | manualListado}}</button>
                </td>
            </ng-container>
            <ng-container matColumnDef="Ajuste_nivel">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por ajuste de nivel">Ajuste</th>
                <td mat-cell *matCellDef="let plantilla">{{plantilla.Ajuste_nivel > 0 ? '+' + plantilla.Ajuste_nivel : plantilla.Ajuste_nivel}}</td>
            </ng-container>
            <ng-container matColumnDef="Nacimiento">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nacimiento">Nacimiento</th>
                <td mat-cell *matCellDef="let plantilla">
                    <mat-checkbox [checked]="plantilla.Nacimiento" [disableRipple]="true" [attr.aria-label]="plantilla.Nacimiento ? 'Heredada' : 'Adquirida'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Prerrequisitos">
                <th mat-header-cell *matHeaderCellDef>Prerrequisitos</th>
                <td mat-cell *matCellDef="let plantilla">
                    <mat-checkbox [checked]="tienePrerrequisitos(plantilla)" [disableRipple]="true"
                        [attr.aria-label]="tienePrerrequisitos(plantilla) ? 'Con prerrequisitos' : 'Sin prerrequisitos'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Oficial">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por oficial">Oficial</th>
                <td mat-cell *matCellDef="let plantilla">
                    <mat-checkbox [checked]="plantilla.Oficial" [disableRipple]="true" [attr.aria-label]="plantilla.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="plantillaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let plantilla; columns: plantillaColumns;" class="elegir" (click)="seleccionarPlantilla(plantilla.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="plantillaColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna plantilla cumple los filtros.' : 'Aún no hay plantillas.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando plantillas"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las plantillas." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de plantillas"></mat-paginator>
</div>
