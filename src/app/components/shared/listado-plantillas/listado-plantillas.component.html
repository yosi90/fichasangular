<div id="container-lista" class="tw-w-full tw-bg-[#212529] tw-h-full">
    <div class="lista-row tw-w-full tw-relative tw-flex tw-justify-center tw-items-center">
        <app-menu-filtros titulo="Filtros de plantillas" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field (keyup)="filtroPlantillas();">
                    <mat-label>Incluye texto</mat-label>
                    <input #plantillaTextInc matInput placeholder="Texto a buscar">
                </mat-form-field>
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [includeAny]="false"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroPlantillas()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="incluirHomebrew"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>

        <table id="plantillas" #tablaPlantillas mat-table [dataSource]="plantillasDS" matSort *ngIf="plantillas.length > 0; else cargando">
            <ng-container matColumnDef="{{column}}" *ngFor="let column of plantillaColumns">
                <th class="tw-text-lg tw-font-medium" mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por {{column}}">
                    {{column.replace('_', ' ')}}
                </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-stroked-button matTooltip="Clic para ver esta plantilla" [matTooltipShowDelay]="200" *ngIf="column == 'Nombre'" color="accent"
                        class="tw-flex tw-justify-start sombra3d tw-w-full" (click)="verDetallesPlantilla(element.Id); $event.stopPropagation();">
                        <mat-icon>read_more</mat-icon>
                        {{element[column]}}
                    </button>
                    <button type="button" class="manual-clickable" *ngIf="column == 'Manual'"
                        (click)="abrirDetalleManual(element, $event)">
                        {{element.Manual?.Nombre}} (p. {{element.Manual?.Pagina}})
                    </button>
                    <p class="tw-mb-0 tw-text-center" *ngIf="column == 'Ajuste_nivel'">
                        {{element.Ajuste_nivel > 0 ? '+' + element.Ajuste_nivel : element.Ajuste_nivel}}
                    </p>
                    <div class="tw-flex tw-justify-center tw-items-center" *ngIf="column == 'Nacimiento'">
                        <mat-checkbox [checked]="element.Nacimiento" [disableRipple]="true"
                            (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                    </div>
                    <div class="tw-flex tw-justify-center tw-items-center" *ngIf="column == 'Prerrequisitos'">
                        <mat-checkbox [checked]="tienePrerrequisitos(element)" [disableRipple]="true"
                            (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                    </div>
                    <div class="tw-flex tw-justify-center tw-items-center" *ngIf="column == 'Oficial'">
                        <mat-checkbox [checked]="element.Oficial" [disableRipple]="true"
                            (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                    </div>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="plantillaColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let element; columns: plantillaColumns;" class="element-row elegir"
                (click)="seleccionarPlantilla(element.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell tw-text-center tw-text-white tw-p-3" [attr.colspan]="plantillaColumns.length">
                    Ninguna plantilla encaja con los filtros
                </td>
            </tr>
        </table>
        <ng-template #cargando>
            <div class="superballs">
                <div class="superballs__dot"></div>
                <div class="superballs__dot"></div>
            </div>
        </ng-template>
    </div>
    <div class="lista-row tw-w-full tw-flex tw-items-center">
        <mat-paginator class="tw-w-full" [pageSizeOptions]="[10, 20, 30, 40]" showFirstLastButtons aria-label="Selecciona una pagina de plantillas">
        </mat-paginator>
    </div>
</div>
