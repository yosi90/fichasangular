<div class="prereq-row-grid">
    <mat-form-field appearance="fill">
        <mat-label>{{definition.catalogLabel || 'Texto'}}</mat-label>
        <input
            matInput
            maxlength="300"
            [value]="row.texto ?? ''"
            [disabled]="disabled"
            (input)="patchChange.emit({ texto: $any($event.target).value })">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Combinación (opcional)</mat-label>
        <input
            matInput
            type="number"
            [value]="row.opcional"
            [disabled]="disabled"
            (input)="patchChange.emit({ opcional: +$any($event.target).value || 0 })">
    </mat-form-field>
</div>
