<div id="container-lista">
    <app-listado-cabecera icono="chakra" titulo="Chakras" [total]="cargado && !errorCarga ? chakrasDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar chakras" placeholder="En español o en inglés">
        <app-menu-filtros titulo="Filtros de chakras" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field>
                    <mat-label>Categoría</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultCategoria" (selectionChange)="filtroChakras();">
                        <mat-option *ngFor="let categoria of categorias" [value]="categoria">{{categoria}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <!-- Sin paginador: los chakras son pocos y van en su orden (corona, pies…), no por nombre. -->
    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="chakras" mat-table [dataSource]="chakrasDS" aria-label="Chakras">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef>Chakra</th>
                <td mat-cell *matCellDef="let fila">
                    <app-listado-nombre tipo="chakra" [nombre]="fila.Nombre" [original]="fila.Original" (abrir)="verDetallesChakra(fila)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Categoria">
                <th mat-header-cell *matHeaderCellDef>Categoría</th>
                <td mat-cell *matCellDef="let fila">{{fila.Categoria || '—'}}</td>
            </ng-container>
            <ng-container matColumnDef="Ranura">
                <th mat-header-cell *matHeaderCellDef>Ranura que cierra</th>
                <td mat-cell *matCellDef="let fila">{{fila.Ranura || '—'}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="chakraColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let fila; columns: chakraColumns;" class="elegir" (click)="seleccionarChakra(fila)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="chakraColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún chakra cumple los filtros.' : 'Aún no hay chakras.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando chakras"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los chakras." (accion)="cargar()"></app-listado-estado>
</div>
