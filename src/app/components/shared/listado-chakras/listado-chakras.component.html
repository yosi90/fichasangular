<div id="container-lista" class="tw-w-full tw-bg-[#212529] tw-h-full">
    <div class="lista-row tw-w-full tw-relative tw-flex tw-justify-center tw-items-center">
        <app-menu-filtros titulo="Filtros de chakras">
            <app-menu-filtros-grupo titulo="Buscar">
                <mat-form-field (keyup)="filtroChakras();">
                    <mat-label>Buscar chakra</mat-label>
                    <input #chakraTextInc matInput placeholder="En español o en inglés">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Categoría</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultCategoria" (selectionChange)="filtroChakras();">
                        <mat-option *ngFor="let categoria of categorias" [value]="categoria">{{categoria}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </app-menu-filtros-grupo>
        </app-menu-filtros>

        <table id="chakras" mat-table [dataSource]="chakrasDS" *ngIf="chakras.length > 0; else cargando">
            <ng-container matColumnDef="{{column}}" *ngFor="let column of chakraColumns">
                <th class="tw-text-lg tw-font-medium" mat-header-cell *matHeaderCellDef>
                    {{titulosColumnas[column]}}
                </th>
                <td mat-cell *matCellDef="let fila">
                    <button mat-stroked-button matTooltip="Clic para ver este chakra" [matTooltipShowDelay]="200"
                        *ngIf="column == 'Nombre'" color="accent" class="tw-flex tw-justify-start sombra3d tw-w-full"
                        (click)="verDetallesChakra(fila); $event.stopPropagation();">
                        <mat-icon>read_more</mat-icon>
                        {{fila.Nombre}}
                        <span class="nombre-original" *ngIf="fila.Original">{{fila.Original}}</span>
                    </button>
                    <span *ngIf="column != 'Nombre'">{{fila[column] === '' ? '—' : fila[column]}}</span>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="chakraColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let fila; columns: chakraColumns;" class="element-row elegir"
                (click)="seleccionarChakra(fila)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell tw-text-center tw-text-white tw-p-3" [attr.colspan]="chakraColumns.length">
                    Ningún chakra encaja con los filtros
                </td>
            </tr>
        </table>
        <ng-template #cargando>
            <div class="superballs">
                <div class="superballs__dot"></div>
                <div class="superballs__dot"></div>
            </div>
        </ng-template>
    </div>
</div>
