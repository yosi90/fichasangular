<div id="container-lista">
    <app-listado-cabecera icono="deidad" titulo="Deidades" [total]="cargado && !errorCarga ? deidadesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar deidades" placeholder="Buscar en el nombre o el texto">
        <app-menu-filtros titulo="Filtros de deidades" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroDeidades()">
                </app-manual-autocomplete>
                <mat-form-field>
                    <mat-label>Alineamiento</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultAlineamiento" (selectionChange)="filtroDeidades();">
                        <mat-option *ngFor="let alineamiento of alineamientos" [value]="alineamiento">{{alineamiento}}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Pabellón</mat-label>
                    <mat-select appearance="fill" [(value)]="defaultPabellon" (selectionChange)="filtroDeidades();">
                        <mat-option *ngFor="let pabellon of pabellones" [value]="pabellon">{{pabellon}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="homebrewActivo"
                    (click)="alternarHomebrew();">{{anuncioHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="deidades" mat-table [dataSource]="deidadesDS" matSort aria-label="Deidades">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let deidad">
                    <app-listado-nombre tipo="deidad" [nombre]="deidad.Nombre" (abrir)="verDetallesDeidad(deidad.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let deidad">
                    <button type="button" class="listado-manual" *ngIf="deidad.Manual?.Nombre" (click)="abrirDetalleManual(deidad, $event)">{{deidad.Manual | manualListado}}</button>
                </td>
            </ng-container>
            <ng-container matColumnDef="Alineamiento">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por alineamiento">Alineamiento</th>
                <td mat-cell *matCellDef="let deidad">{{deidad.Alineamiento?.Nombre}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="deidadColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let deidad; columns: deidadColumns;" class="elegir" (click)="seleccionarDeidad(deidad.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="deidadColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna deidad cumple los filtros.' : 'Aún no hay deidades.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando deidades"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las deidades." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de deidades"></mat-paginator>
</div>
