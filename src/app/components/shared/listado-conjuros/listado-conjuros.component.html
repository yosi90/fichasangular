<div id="container-lista">
    <app-listado-cabecera icono="conjuro" titulo="Conjuros" [total]="cargado && !errorCarga ? conjurosDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar conjuros" placeholder="Buscar conjuros">
        <app-menu-filtros titulo="Filtros de conjuros" [hayFiltros]="hayFiltros" (limpiar)="limpiarFiltros()">
            <app-menu-filtros-grupo titulo="Buscar">
                <app-manual-autocomplete
                    [manuales]="Manuales"
                    [(value)]="defaultManual"
                    (selectionChange)="filtroConjuros()">
                </app-manual-autocomplete>
            </app-menu-filtros-grupo>
            <app-menu-filtros-grupo titulo="Mostrar" [chips]="true">
                <mat-chip-option color="warn" class="filtro-chip" [selected]="mostrarHomebrew"
                    (click)="alternarConjurosHomebrew();">{{anuncioConjurosHomebrew}}</mat-chip-option>
            </app-menu-filtros-grupo>
        </app-menu-filtros>
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="conjuros" mat-table [dataSource]="conjurosDS" matSort aria-label="Conjuros">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let conjuro">
                    <app-listado-nombre [tipo]="tipoDe(conjuro)" [nombre]="conjuro.Nombre" (abrir)="verDetallesConjuro(conjuro.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <ng-container matColumnDef="Manual">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por manual">Manual</th>
                <td mat-cell *matCellDef="let conjuro">
                    <button type="button" class="listado-manual" (click)="abrirDetalleManual(conjuro, $event)">{{conjuro.Manual | manualListado}}</button>
                </td>
            </ng-container>
            <ng-container *ngFor="let disciplina of disciplinas" [matColumnDef]="disciplina.columna">
                <th mat-header-cell *matHeaderCellDef mat-sort-header [sortActionDescription]="'Ordenar por ' + disciplina.etiqueta">{{disciplina.etiqueta}}</th>
                <td mat-cell *matCellDef="let conjuro">
                    <mat-checkbox *ngIf="conjuro[disciplina.columna]" [checked]="true" [disableRipple]="true" [attr.aria-label]="disciplina.etiqueta"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <ng-container matColumnDef="Homebrew">
                <th mat-header-cell *matHeaderCellDef>Homebrew</th>
                <td mat-cell *matCellDef="let conjuro">
                    <mat-checkbox [checked]="!conjuro.Oficial" [disableRipple]="true" [attr.aria-label]="conjuro.Oficial ? 'Oficial' : 'Homebrew'"
                        (click)="$event.preventDefault(); $event.stopPropagation();"></mat-checkbox>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="conjuroColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let conjuro; columns: conjuroColumns;" class="elegir" (click)="seleccionarConjuro(conjuro.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="conjuroColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ningún conjuro cumple los filtros.' : 'Aún no hay conjuros.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando conjuros"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar los conjuros." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de conjuros"></mat-paginator>
</div>
