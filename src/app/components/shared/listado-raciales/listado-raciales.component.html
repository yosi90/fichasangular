<div id="container-lista">
    <app-listado-cabecera icono="racial" titulo="Raciales" [total]="cargado && !errorCarga ? racialesDS.data.length : null"
        [texto]="textoBusqueda" (textoChange)="buscar($event)" etiquetaBuscar="Buscar raciales" placeholder="Buscar en el nombre o la descripción">
    </app-listado-cabecera>

    <div class="listado__tabla" [class.listado-oculto]="!cargado || errorCarga">
        <table id="raciales" mat-table [dataSource]="racialesDS" matSort aria-label="Raciales">
            <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Ordenar por nombre">Nombre</th>
                <td mat-cell *matCellDef="let racial">
                    <app-listado-nombre tipo="racial" [nombre]="racial.Nombre" (abrir)="verDetallesRacial(racial.Id)"></app-listado-nombre>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="racialColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let racial; columns: racialColumns;" class="elegir" (click)="seleccionarRacial(racial.Id)"></tr>
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="racialColumns.length">
                    <app-listado-estado tipo="vacio" [mensaje]="hayFiltros ? 'Ninguna racial cumple la búsqueda.' : 'Aún no hay raciales.'"
                        [textoAccion]="hayFiltros ? 'Limpiar filtros' : ''" (accion)="limpiarFiltros()"></app-listado-estado>
                </td>
            </tr>
        </table>
    </div>

    <app-listado-estado *ngIf="!cargado" tipo="cargando" etiqueta="Cargando raciales"></app-listado-estado>
    <app-listado-estado *ngIf="cargado && errorCarga" tipo="error" mensaje="No se pudieron cargar las raciales." (accion)="cargar()"></app-listado-estado>

    <mat-paginator class="listado-paginador" [class.listado-oculto]="!cargado || errorCarga" aria-label="Páginas de raciales"></mat-paginator>
</div>
