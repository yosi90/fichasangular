<app-creacion-ventana [titulo]="titulo" [subtitulo]="descripcion" (cerrar)="onCerrar()" (pulsarFondo)="onCerrar()">
    <div class="creacion-opciones" role="listbox" [attr.aria-label]="titulo" *ngIf="opciones.length > 0; else sinOpcionesTpl">
        <div class="creacion-opcion creacion-opcion--caja"
            *ngFor="let opcion of opciones; trackBy: trackByClave"
            [class.creacion-opcion--activa]="esOpcionSeleccionada(opcion.clave)"
            tabindex="0"
            role="option"
            [attr.aria-selected]="esOpcionSeleccionada(opcion.clave)"
            (click)="seleccionarOpcion(opcion.clave)"
            (keydown.enter)="seleccionarOpcion(opcion.clave); $event.preventDefault()"
            (keydown.space)="seleccionarOpcion(opcion.clave); $event.preventDefault()">
            <span class="creacion-opcion__texto">
                {{opcion.nombre}}
                <span class="creacion-opcion__nota" *ngIf="opcion.extra.length > 0">{{opcion.extra}}</span>
            </span>
            <span class="creacion-etiqueta">{{getEtiquetaTipo(opcion.tipo)}}</span>
        </div>
    </div>

    <ng-template #sinOpcionesTpl>
        <p class="creacion-vacio">No hay opciones disponibles para este grupo.</p>
    </ng-template>

    <button ventanaSecundaria mat-stroked-button type="button" (click)="onCerrar()">Cancelar</button>
    <button ventanaPrincipal mat-raised-button color="primary" type="button" [disabled]="!puedeConfirmar" (click)="onConfirmar()">
        Confirmar elección
    </button>
</app-creacion-ventana>
