<app-creacion-ventana [titulo]="titulo" subtitulo="Elige el tipo de criatura" [cerrable]="false" ancho="ancha" [relleno]="false">
    <div class="creacion-ventana__columnas">
        <div class="creacion-ventana__lista">
            <label class="creacion-buscador">
                <mat-icon aria-hidden="true">search</mat-icon>
                <input type="search" [(ngModel)]="filtroTexto" placeholder="Filtrar enemigos" aria-label="Filtrar enemigos">
            </label>
            <ul class="creacion-opciones" *ngIf="enemigosFiltrados.length > 0; else sinEnemigosTpl">
                <li *ngFor="let enemigo of enemigosFiltrados; trackBy: trackByEnemigoId">
                    <button type="button" class="creacion-opcion" [class.creacion-opcion--activa]="esSeleccionado(enemigo.Id)"
                        [attr.aria-pressed]="esSeleccionado(enemigo.Id)"
                        (click)="onSeleccionar(enemigo.Id)"
                        (keydown.enter)="onSeleccionarFilaTeclado(enemigo.Id, $event)"
                        (keydown.space)="onSeleccionarFilaTeclado(enemigo.Id, $event)">
                        <span class="creacion-opcion__texto">{{enemigo.Nombre}}</span>
                    </button>
                </li>
            </ul>
            <ng-template #sinEnemigosTpl>
                <p class="creacion-vacio" *ngIf="enemigosDisponibles.length < 1">No hay enemigos predilectos disponibles en catálogo.</p>
                <p class="creacion-vacio" *ngIf="enemigosDisponibles.length > 0">No hay resultados para «{{filtroTexto}}».</p>
            </ng-template>
        </div>

        <div class="creacion-ventana__detalle">
            <h3 class="creacion-titulo">Resultado tras confirmar</h3>
            <ul class="creacion-resultado" *ngIf="previewEnemigos.length > 0; else sinPreviewTpl">
                <li *ngFor="let item of previewEnemigos; trackBy: trackByPreviewEnemigoId">
                    <span>{{item.nombre}}</span><span>+{{item.bono}}</span>
                </li>
            </ul>
            <ng-template #sinPreviewTpl>
                <p class="creacion-vacio">Aún no hay enemigos predilectos seleccionados.</p>
            </ng-template>
        </div>
    </div>

    <button ventanaPrincipal mat-raised-button color="primary" type="button" [disabled]="!puedeConfirmar" (click)="onConfirmar()">
        Confirmar enemigo
    </button>
</app-creacion-ventana>
