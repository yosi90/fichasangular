<app-creacion-ventana [titulo]="titulo"
    [subtitulo]="razaContextoNombre.trim().length > 0 ? 'Opciones disponibles para ' + razaContextoNombre + '.' : ''"
    (cerrar)="onCerrar()" (pulsarFondo)="onCerrar()">
    <button ventanaCabecera mat-icon-button type="button" aria-label="Información" matTooltip="Qué son los raciales opcionales" (click)="onInfo()">
        <mat-icon>info</mat-icon>
    </button>

    <ng-container *ngIf="requiereSeleccion; else sinOpcionalesTpl">
        <section class="creacion-ventana__seccion" *ngFor="let grupo of grupos; trackBy: trackByGrupo">
            <h3 class="creacion-titulo">Grupo de opciones {{grupo.grupo}}</h3>
            <p class="creacion-texto-suave" *ngIf="grupoSinOpcionesHabilitadas(grupo)">
                Este grupo no tiene opciones habilitadas con la identidad actual.
            </p>
            <div class="creacion-opciones creacion-opciones--rejilla" role="radiogroup" [attr.aria-label]="'Grupo de opciones ' + grupo.grupo">
                <div class="racial-opcion" *ngFor="let opcion of grupo.opciones; trackBy: trackByOpcion">
                    <button type="button" role="radio" class="creacion-opcion creacion-opcion--caja"
                        [class.creacion-opcion--activa]="esSeleccionada(grupo.grupo, opcion.clave)"
                        [class.creacion-opcion--bloqueada]="!esOpcionHabilitada(opcion)"
                        [attr.aria-checked]="esSeleccionada(grupo.grupo, opcion.clave)"
                        [disabled]="!esOpcionHabilitada(opcion)"
                        (click)="onSeleccionar(grupo.grupo, opcion.clave, esOpcionHabilitada(opcion))">
                        <span class="creacion-opcion__texto">
                            {{opcion.racial.Nombre}}
                            <span class="creacion-opcion__nota racial-bloqueo" *ngIf="!esOpcionHabilitada(opcion)">{{getTextoBloqueo(opcion)}}</span>
                            <span class="creacion-opcion__nota racial-aviso"
                                *ngIf="opcion.estado === 'eligible_with_warning' && getTextoAdvertencia(opcion).length > 0">{{getTextoAdvertencia(opcion)}}</span>
                        </span>
                    </button>
                    <button mat-icon-button type="button" [disabled]="!tieneDetalleRacial(opcion.racial)"
                        (click)="onVerDetalleRacial(opcion.racial, $event)" aria-label="Ver detalle de racial" matTooltip="Ver detalle completo">
                        <mat-icon>open_in_new</mat-icon>
                    </button>
                </div>
            </div>
        </section>
    </ng-container>

    <ng-template #sinOpcionalesTpl>
        <p class="creacion-vacio">Esta raza no tiene raciales opcionales que resolver.</p>
    </ng-template>

    <button ventanaSecundaria mat-stroked-button type="button" (click)="onCerrar()">Cancelar</button>
    <button ventanaPrincipal mat-raised-button color="primary" type="button" [disabled]="!puedeConfirmar" (click)="onConfirmar()">
        Confirmar selección
    </button>
</app-creacion-ventana>
