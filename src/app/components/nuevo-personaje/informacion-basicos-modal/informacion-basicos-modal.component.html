<app-creacion-ventana [titulo]="titulo" (cerrar)="onCerrar()" (pulsarFondo)="onCerrar()">
    <mat-icon ventanaCabecera class="info-icono" aria-hidden="true">{{icono}}</mat-icon>
    <section class="creacion-ventana__seccion" *ngFor="let seccion of secciones">
        <h3 class="creacion-titulo" *ngIf="(seccion.titulo ?? '').length > 0">{{seccion.titulo}}</h3>
        <ul class="info-lista" *ngIf="(seccion.items ?? []).length > 0">
            <li *ngFor="let item of seccion.items">{{item}}</li>
        </ul>
        <p class="info-linea" *ngFor="let linea of seccion.lineas ?? []">{{linea}}</p>
    </section>

    <button ventanaPrincipal mat-raised-button color="primary" type="button" (click)="onCerrar()">Entendido</button>
</app-creacion-ventana>
