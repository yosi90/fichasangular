<app-creacion-ventana [titulo]="titulo" [subtitulo]="habilidadNombre.length > 0 ? 'Selecciona el extra para ' + habilidadNombre + '.' : ''"
    (cerrar)="onCerrar()" (pulsarFondo)="onCerrar()">
    <label class="creacion-buscador">
        <mat-icon aria-hidden="true">search</mat-icon>
        <input type="search" [(ngModel)]="filtroTexto" placeholder="Buscar extra" aria-label="Buscar extra">
    </label>

    <div class="creacion-opciones" role="listbox" [attr.aria-label]="titulo" *ngIf="opcionesFiltradas.length > 0; else sinExtrasTpl">
        <div class="creacion-opcion"
            *ngFor="let opcion of opcionesFiltradas"
            [class.creacion-opcion--activa]="esOpcionSeleccionada(opcion.valor)"
            tabindex="0"
            role="option"
            [attr.aria-selected]="esOpcionSeleccionada(opcion.valor)"
            (click)="seleccionarOpcion(opcion.valor)"
            (keydown.enter)="seleccionarOpcion(opcion.valor); $event.preventDefault()"
            (keydown.space)="seleccionarOpcion(opcion.valor); $event.preventDefault()">
            <span class="creacion-opcion__texto">
                {{opcion.valor}}
                <span class="creacion-opcion__nota" *ngIf="opcion.descripcion.length > 0">{{opcion.descripcion}}</span>
            </span>
        </div>
    </div>

    <ng-template #sinExtrasTpl>
        <p class="creacion-vacio">No hay extras que encajen con el filtro actual.</p>
    </ng-template>

    <button ventanaSecundaria mat-stroked-button type="button" (click)="onCerrar()">Cancelar</button>
    <button ventanaPrincipal mat-raised-button color="primary" type="button" [disabled]="!puedeConfirmar" (click)="onConfirmar()">
        Confirmar extra
    </button>
</app-creacion-ventana>
