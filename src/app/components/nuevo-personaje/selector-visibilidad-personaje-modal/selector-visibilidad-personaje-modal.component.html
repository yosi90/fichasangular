<app-creacion-ventana titulo="Visibilidad del personaje"
    [subtitulo]="soloPrivado ? 'Un PNJ nace privado: tus jugadores no lo ven hasta que tú quieras.' : 'Decide si este personaje será visible solo para su creador o para todo el mundo.'" ancho="estrecha"
    [cierreBloqueado]="bloqueado" (cerrar)="onCerrar()" (pulsarFondo)="onCerrar()">
    <div class="creacion-opciones" role="radiogroup" aria-label="Visibilidad del personaje">
        <button type="button" role="radio" class="creacion-opcion creacion-opcion--caja" [class.creacion-opcion--activa]="seleccion === false"
            [attr.aria-checked]="seleccion === false" [disabled]="bloqueado" (click)="onSeleccionar(false)">
            <span class="creacion-opcion__texto">Solo para mí</span>
        </button>
        <button type="button" role="radio" class="creacion-opcion creacion-opcion--caja" [class.creacion-opcion--activa]="seleccion === true"
            [attr.aria-checked]="seleccion === true" [disabled]="bloqueado || soloPrivado" [class.creacion-opcion--bloqueada]="soloPrivado"
            (click)="onSeleccionar(true)">
            <span class="creacion-opcion__texto">Todo el mundo
                <span class="creacion-opcion__nota" *ngIf="soloPrivado">Podrás hacerlo público desde su ficha cuando quieras.</span>
            </span>
        </button>
    </div>

    <button ventanaSecundaria mat-stroked-button type="button" [disabled]="bloqueado" (click)="onCerrar()">Cancelar</button>
    <button ventanaPrincipal mat-raised-button color="primary" type="button" [disabled]="!puedeConfirmar" (click)="onConfirmar()">
        Confirmar
    </button>
</app-creacion-ventana>
