<mat-card id="menu" class="sombra-interna">
    <aside>
        <span
            class="tw-block"
            [matTooltip]="tooltipNuevoPersonaje"
            [matTooltipDisabled]="!nuevoPersonajeDeshabilitado">
            <button
                id="nuevopj"
                mat-raised-button
                color="primary"
                (click)="AbrirNuevoPersonaje();"
                [disabled]="nuevoPersonajeDeshabilitado"
                class="tw-w-full sombra tw-mt-1 tw-mb-3">
                Nuevo personaje
            </button>
        </span>
        <mat-accordion>
            <mat-expansion-panel #primero>
                <mat-expansion-panel-header class="tw-rounded-none tw-rounded-t-md">
                    <button mat-stroked-button color="accent" class="tw-rounded-none tw-rounded-t-md">
                        <mat-icon data-icono="adorno">add_box</mat-icon>Insertar
                    </button>
                </mat-expansion-panel-header>
                <ng-container *ngTemplateOutlet="principalesConPermiso; context: { $implicit: 'insertar' }"></ng-container>
                <ng-container *ngTemplateOutlet="gruposOtrosMenu; context: { $implicit: 'insertar' }"></ng-container>
            </mat-expansion-panel>
            <mat-expansion-panel #segundo>
                <mat-expansion-panel-header>
                    <button mat-stroked-button color="accent" class="tw-rounded-none">
                        <mat-icon data-icono="adorno">edit_square</mat-icon>Modificar
                    </button>
                </mat-expansion-panel-header>
                <ng-container *ngTemplateOutlet="principalesConPermiso; context: { $implicit: 'modificar' }"></ng-container>
                <ng-container *ngTemplateOutlet="gruposOtrosMenu; context: { $implicit: 'modificar' }"></ng-container>
            </mat-expansion-panel>
            <mat-expansion-panel class="tw-rounded-none tw-rounded-b-md" #tercero>
                <mat-expansion-panel-header>
                    <button mat-stroked-button color="accent" class="tw-rounded-none tw-rounded-b-md">
                        <mat-icon data-icono="adorno">search</mat-icon>Detalles
                    </button>
                </mat-expansion-panel-header>
                <button mat-button color="primary" class="menu-opcion" *ngFor="let opcion of principales.detalles"
                    (click)="opcion.abrir()"><app-icono-rol [tipo]="opcion.tipo" [tamano]="16" recuadro="oscuro" data-icono="leyenda"></app-icono-rol><span>{{ opcion.etiqueta }}</span></button>
                <ng-container *ngTemplateOutlet="gruposOtrosMenu; context: { $implicit: 'detalles' }"></ng-container>
            </mat-expansion-panel>
            <!-- «Mis campañas» (ronda de noviembre, decisión 3): con sesión, para quien puede tener campañas o ya está en una. -->
            <button type="button" class="menu-dados menu-campanas" *ngIf="misCampanasVisible$ | async" (click)="abrirMisCampanas()">
                <app-icono-rol tipo="campana" [tamano]="22" data-icono="leyenda"></app-icono-rol><span>Mis campañas</span>
            </button>
            <!-- Debajo de las de catálogo (lienzo «Dados: Companion y web»): abre la pestaña «Dados». -->
            <button type="button" class="menu-dados" (click)="abrirDados()">
                <app-icono-rol tipo="dado-d20" [tamano]="22" data-icono="leyenda"></app-icono-rol><span>Dados</span>
            </button>
            <mat-expansion-panel hideToggle="true" #cuarto>
                <mat-expansion-panel-header>
                    <button mat-stroked-button color="accent">
                        <mat-icon data-icono="adorno">account_circle</mat-icon>{{usr}}
                    </button>
                </mat-expansion-panel-header>

                <div class="user-panel-card" *ngIf="usr == 'Invitado'; else sinRegistrar">
                    <button mat-button class="user-panel-link user-panel-link--login" (click)="openSesionDialog()">
                        <span class="user-panel-link__lead">
                            <mat-icon data-icono="estado">login</mat-icon>
                            <span>Identifícate</span>
                        </span>
                    </button>
                </div>
                <ng-template #sinRegistrar>
                    <div class="user-panel-card">
                        <div class="user-panel-links">
                            <button mat-button class="user-panel-link user-panel-link--primary" (click)="abrirMiPerfil()">
                                <span class="user-panel-link__lead">
                                    <mat-icon data-icono="adorno">account_circle</mat-icon>
                                    <span>Mi perfil</span>
                                </span>
                            </button>
                            <button mat-button class="user-panel-link" (click)="abrirSocial()">
                                <span class="user-panel-link__lead">
                                    <mat-icon data-icono="adorno">hub</mat-icon>
                                    <span>Social</span>
                                </span>
                            </button>
                        </div>
                        <div class="user-panel-footer">
                            <button mat-button class="user-panel-link user-panel-link--danger" (click)="logOut()">
                                <span class="user-panel-link__lead">
                                    <mat-icon data-icono="estado">logout</mat-icon>
                                    <span>Cerrar sesión</span>
                                </span>
                            </button>
                        </div>
                    </div>
                </ng-template>
            </mat-expansion-panel>
        </mat-accordion>
    </aside>
    <!-- Los seis principales de Insertar y Modificar (`principales`, de `CATALOGOS_PRINCIPALES`), con su permiso. -->
    <ng-template #principalesConPermiso let-seccion>
        <span *ngFor="let opcion of principalesDe(seccion)"
            [matTooltip]="opcion.habilitada() ? '' : mensajePermisosInsuficientes"
            [matTooltipDisabled]="opcion.habilitada()">
            <button mat-button color="primary" class="menu-opcion" [disabled]="!opcion.habilitada()"
                (click)="opcion.abrir()"><app-icono-rol [tipo]="opcion.tipo" [tamano]="16" recuadro="oscuro" data-icono="leyenda"></app-icono-rol><span>{{ opcion.etiqueta }}</span></button>
        </span>
    </ng-template>
    <!--
        Los «Otros» de Insertar, Modificar y Detalles: los mismos grupos en los tres (gruposOtros). Son una barra de menús
        vertical (menú de la CDK): con uno abierto, pasar por encima de otro grupo cierra el primero y abre ese; se cierran
        al pulsar fuera, con Esc o al elegir, y se navega con las flechas.
    -->
    <ng-template #gruposOtrosMenu let-seccion>
        <div class="menu-otros-grupos" cdkMenu [attr.aria-label]="'Otros de ' + seccion">
            <button mat-button color="primary" class="menu-otros-trigger" *ngFor="let grupo of gruposDe(seccion)"
                cdkMenuItem [cdkMenuTriggerFor]="panelOtros" [cdkMenuTriggerData]="{ $implicit: grupo }"
                [cdkMenuPosition]="posicionesOtros" #grupoOtros="cdkMenuTriggerFor"
                [class.menu-otros-trigger--sin-opciones]="!tieneOpcionesGrupo(grupo)">
                {{ grupo.titulo }} ({{ grupo.opciones.length }})
                <mat-icon iconPositionEnd data-icono="accion">arrow_right</mat-icon>
            </button>
        </div>
    </ng-template>
    <ng-template #panelOtros let-grupo>
        <div class="menu-otros-panel" cdkMenu [attr.aria-label]="grupo.titulo">
            <span class="menu-otros-panel__titulo" aria-hidden="true">{{ grupo.titulo }}</span>
            <span class="menu-otros-panel__opcion" *ngFor="let opcion of grupo.opciones"
                matTooltipClass="menu-otros-tooltip"
                matTooltipPosition="right"
                [matTooltip]="opcion.habilitada() ? '' : mensajePermisosInsuficientes"
                [matTooltipDisabled]="opcion.habilitada()">
                <button mat-button color="primary" class="menu-opcion" cdkMenuItem [disabled]="!opcion.habilitada()"
                    [cdkMenuItemDisabled]="!opcion.habilitada()" (cdkMenuItemTriggered)="opcion.abrir()"><app-icono-rol [tipo]="opcion.tipo" [tamano]="16" recuadro="oscuro" data-icono="leyenda"></app-icono-rol><span>{{ opcion.etiqueta }}</span></button>
            </span>
        </div>
    </ng-template>
</mat-card>
