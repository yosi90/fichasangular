<div class="ribbon-nav">
    <button type="button" class="ribbon-trigger ribbon-trigger--icon ribbon-menu" *ngIf="esMovil" (click)="alternarMenu()"
        aria-label="Abrir el menú" [attr.aria-expanded]="menuAbierto">
        <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <!--
        Archivo, Manuales, Opciones y Ayuda son una barra de menús (menú de la CDK): con uno abierto, pasar por encima de
        otro botón cierra el primero y abre ese; se cierran al pulsar fuera, con Esc o al elegir, y se navega con las flechas.
    -->
    <div class="ribbon-barra" cdkMenuBar aria-label="Menús de Rol">
        <button type="button" class="ribbon-trigger ribbon-trigger--icon" cdkMenuItem [cdkMenuTriggerFor]="menuArchivo"
            matTooltip="Archivo" aria-label="Archivo">
            <mat-icon>folder</mat-icon>
            <span class="solo-lectores">Archivo</span>
        </button>
        <button type="button" class="ribbon-trigger ribbon-trigger--icon" cdkMenuItem [cdkMenuTriggerFor]="menuManuales"
            matTooltip="Manuales" aria-label="Manuales">
            <mat-icon>menu_book</mat-icon>
            <span class="solo-lectores">Manuales</span>
        </button>
        <button type="button" class="ribbon-trigger ribbon-trigger--icon" cdkMenuItem [cdkMenuTriggerFor]="menuOpciones"
            matTooltip="Opciones" aria-label="Opciones">
            <mat-icon>tune</mat-icon>
            <span class="solo-lectores">Opciones</span>
        </button>
        <button type="button" class="ribbon-trigger ribbon-trigger--icon" cdkMenuItem [cdkMenuTriggerFor]="menuAyuda"
            matTooltip="Ayuda" aria-label="Ayuda">
            <mat-icon>help_center</mat-icon>
            <span class="solo-lectores">Ayuda</span>
        </button>
    </div>
    <!-- La búsqueda global (lienzo, vista 5): también con Ctrl+K o ⌘K desde cualquier pantalla. -->
    <button type="button" class="ribbon-buscar" (click)="abrirBuscador()" [attr.aria-keyshortcuts]="atajoBuscar === '⌘K' ? 'Meta+K' : 'Control+K'"
        [matTooltip]="'Buscar en Rol (' + atajoBuscar + ')'">
        <mat-icon aria-hidden="true">search</mat-icon>
        <span class="ribbon-buscar__texto">Buscar</span>
        <kbd class="ribbon-buscar__atajo">{{atajoBuscar}}</kbd>
    </button>
    <div class="ribbon-spacer" aria-hidden="true"></div>
    <!-- El centro de notificaciones de Yosiftware (ecosistema-kit/NOTIFICACIONES.md): sin sesión no enseña nada. -->
    <yosi-notificaciones class="ribbon-notificaciones" (yosi-notificacion-abrir)="onNotificacionAbrir($event)"></yosi-notificaciones>
    <!-- Las webs del ecosistema y el panel de cuentas, obligatorios en la cabecera (ecosistema-kit/ACCESO.md). -->
    <yosi-webs class="ribbon-yosi"></yosi-webs>
    <yosi-acceso class="ribbon-yosi ribbon-yosi--cuenta"></yosi-acceso>
</div>

<ng-template #menuArchivo>
    <div class="menuSuperficieOscura ribbon-panel ribbon-menu-shell" cdkMenu aria-label="Archivo">
        <div class="menu-user-state">
            <span class="menu-user-state__eyebrow">Sesión actual</span>
            <strong class="menu-user-state__title">{{usr}}</strong>
            <span class="menu-user-state__subtitle">{{userSubLabel}}</span>
        </div>

        <button type="button" class="ribbon-panel__item" cdkMenuItem *ngIf="isLoggedIn" (cdkMenuItemTriggered)="abrirMiPerfil()">
            <mat-icon>account_circle</mat-icon>
            <span>Mi perfil</span>
        </button>

        <button type="button" class="ribbon-panel__item" cdkMenuItem *ngIf="isLoggedIn" (cdkMenuItemTriggered)="abrirSocial()">
            <mat-icon>hub</mat-icon>
            <span>Social</span>
        </button>

        <div class="menu-separator" *ngIf="isLoggedIn" role="separator"></div>

        <button type="button" class="ribbon-panel__item menu-entry-danger" cdkMenuItem *ngIf="isLoggedIn" (cdkMenuItemTriggered)="logOut()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
        </button>

        <button type="button" class="ribbon-panel__item" cdkMenuItem *ngIf="!isLoggedIn" (cdkMenuItemTriggered)="openSesionDialog()">
            <mat-icon>login</mat-icon>
            <span>Entrar</span>
        </button>
    </div>
</ng-template>

<ng-template #menuManuales>
    <div class="menuSuperficieOscura menuSuperficieOscura--wide ribbon-panel manuales-menu" cdkMenu aria-label="Manuales">
        <p class="menu-estado" *ngIf="isLoading">
            Cargando manuales...
        </p>

        <p class="menu-estado tw-text-[#dc3545]" *ngIf="!isLoading && errorState">
            {{errorState}}
        </p>

        <p class="menu-estado tw-text-[#ffc107]" *ngIf="!isLoading && !errorState && fallbackNotice">
            {{fallbackNotice}}
        </p>

        <p class="menu-estado" *ngIf="!isLoading && !errorState && manuales.length === 0">
            Todavía no hay manuales en la caché.
        </p>

        <div class="manuales-lista" *ngIf="!isLoading && !errorState && manuales.length > 0">
            <button type="button" class="manual-item manual-item-clickable" cdkMenuItem *ngFor="let manual of manuales"
                matTooltip="Abrir vista del manual" [matTooltipShowDelay]="180"
                (cdkMenuItemTriggered)="abrirManual(manual)">
                <span class="manual-linea">
                    <span class="manual-nombre">{{manual.Nombre}}</span>
                    <span class="manual-actions">
                        <span class="chip chip-estado" [ngClass]="manual.Oficial ? 'chip-oficial' : 'chip-homebrew'">
                            {{manual.Oficial ? 'Oficial' : 'Homebrew'}}
                        </span>
                    </span>
                </span>
                <span class="manual-chips">
                    <span class="chip chip-categoria" *ngFor="let categoria of getCategorias(manual)">
                        <mat-icon class="chip-categoria-icon">{{categoria.icono}}</mat-icon>
                        {{categoria.label}}
                    </span>
                </span>
            </button>
        </div>
    </div>
</ng-template>

<ng-template #menuOpciones>
    <div class="menuSuperficieOscura menuSuperficieOscura--options ribbon-panel options-menu ribbon-menu-shell" cdkMenu aria-label="Opciones">
        <div class="options-section">
            <span class="options-section__eyebrow">Cuenta</span>
            <button type="button" class="ribbon-panel__item" cdkMenuItem [cdkMenuItemDisabled]="!isLoggedIn" (cdkMenuItemTriggered)="abrirSeccionPerfil('resumen')">
                <mat-icon>badge</mat-icon>
                <span>Mi cuenta</span>
            </button>
            <button type="button" class="ribbon-panel__item" cdkMenuItem [cdkMenuItemDisabled]="!isLoggedIn" (cdkMenuItemTriggered)="abrirSeccionPerfil('preferencias')">
                <mat-icon>tune</mat-icon>
                <span>Preferencias de Rol</span>
            </button>
            <button type="button" class="ribbon-panel__item" cdkMenuItem [cdkMenuItemDisabled]="!isLoggedIn" (cdkMenuItemTriggered)="editarPerfilPlataforma()">
                <mat-icon>account_circle</mat-icon>
                <span>Perfil de Yosiftware</span>
            </button>
            <!-- Sin sesión, el SDK explica qué sabe Yosiftware de quien usa Rol sin cuenta. -->
            <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirPrivacidad()">
                <mat-icon>lock</mat-icon>
                <span>Privacidad</span>
            </button>
        </div>

        <div class="options-section" *ngIf="!isLoggedIn">
            <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="openSesionDialog()">
                <mat-icon>login</mat-icon>
                <span>Entrar</span>
            </button>
        </div>
    </div>
</ng-template>

<ng-template #menuAyuda>
    <div class="menuSuperficieOscura ribbon-panel ribbon-menu-shell" cdkMenu aria-label="Ayuda">
        <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirAyuda('primeros-pasos')">
            <mat-icon>help_center</mat-icon>
            <span>Primeros pasos</span>
        </button>
        <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirAyuda('novedades')">
            <mat-icon>map</mat-icon>
            <span>Novedades</span>
        </button>
        <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirAyuda('legal')">
            <mat-icon>gavel</mat-icon>
            <span>Legal y privacidad</span>
        </button>
        <a class="ribbon-panel__item" cdkMenuItem [href]="urlCompanion" target="_blank" rel="noopener">
            <mat-icon>phone_android</mat-icon>
            <span>Descargar 3.5 Companion</span>
        </a>
        <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirReportarBug()">
            <mat-icon>bug_report</mat-icon>
            <span>Reportar bug</span>
        </button>
        <button type="button" class="ribbon-panel__item" cdkMenuItem (cdkMenuItemTriggered)="abrirSolicitarFuncionalidad()">
            <mat-icon>lightbulb</mat-icon>
            <span>Solicitar funcionalidad</span>
        </button>
    </div>
</ng-template>
