<div class="ribbon-nav">
    <button type="button" class="ribbon-trigger ribbon-trigger--icon ribbon-menu" *ngIf="esMovil" (click)="alternarMenu()"
        aria-label="Abrir el menú" [attr.aria-expanded]="menuAbierto">
        <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <button type="button" class="ribbon-trigger ribbon-trigger--icon" #archivoTrigger="matMenuTrigger" [matMenuTriggerFor]="menuArchivo"
        matTooltip="Archivo" aria-label="Archivo"
        (click)="onRibbonTriggerClick(archivoTrigger)"
        (menuOpened)="onRibbonMenuOpened(archivoTrigger)"
        (menuClosed)="onRibbonMenuClosed(archivoTrigger)"
        (mouseenter)="onRibbonTriggerEnter(archivoTrigger)"
        (mouseleave)="onRibbonTriggerLeave(archivoTrigger)">
        <mat-icon>folder</mat-icon>
        <span class="solo-lectores">Archivo</span>
    </button>
    <button type="button" class="ribbon-trigger ribbon-trigger--icon" #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="menuManuales"
        matTooltip="Manuales" aria-label="Manuales"
        (click)="onRibbonTriggerClick(menuTrigger)"
        (menuOpened)="onRibbonMenuOpened(menuTrigger)"
        (menuClosed)="onRibbonMenuClosed(menuTrigger)"
        (mouseenter)="onRibbonTriggerEnter(menuTrigger)"
        (mouseleave)="onRibbonTriggerLeave(menuTrigger)">
        <mat-icon>menu_book</mat-icon>
        <span class="solo-lectores">Manuales</span>
    </button>
    <button type="button" class="ribbon-trigger ribbon-trigger--icon" #opcionesTrigger="matMenuTrigger" [matMenuTriggerFor]="menuOpciones"
        matTooltip="Opciones" aria-label="Opciones"
        (click)="onRibbonTriggerClick(opcionesTrigger)"
        (menuOpened)="onRibbonMenuOpened(opcionesTrigger)"
        (menuClosed)="onRibbonMenuClosed(opcionesTrigger)"
        (mouseenter)="onRibbonTriggerEnter(opcionesTrigger)"
        (mouseleave)="onRibbonTriggerLeave(opcionesTrigger)">
        <mat-icon>tune</mat-icon>
        <span class="solo-lectores">Opciones</span>
    </button>
    <button type="button" class="ribbon-trigger ribbon-trigger--icon" #ayudaTrigger="matMenuTrigger" [matMenuTriggerFor]="menuAyuda"
        matTooltip="Ayuda" aria-label="Ayuda"
        (click)="onRibbonTriggerClick(ayudaTrigger)"
        (menuOpened)="onRibbonMenuOpened(ayudaTrigger)"
        (menuClosed)="onRibbonMenuClosed(ayudaTrigger)"
        (mouseenter)="onRibbonTriggerEnter(ayudaTrigger)"
        (mouseleave)="onRibbonTriggerLeave(ayudaTrigger)">
        <mat-icon>help_center</mat-icon>
        <span class="solo-lectores">Ayuda</span>
    </button>
    <!-- La búsqueda global (lienzo, vista 5): también con Ctrl+K o ⌘K desde cualquier pantalla. -->
    <button type="button" class="ribbon-buscar" (click)="abrirBuscador()" [attr.aria-keyshortcuts]="atajoBuscar === '⌘K' ? 'Meta+K' : 'Control+K'"
        [matTooltip]="'Buscar en Rol (' + atajoBuscar + ')'">
        <mat-icon aria-hidden="true">search</mat-icon>
        <span class="ribbon-buscar__texto">Buscar</span>
        <kbd class="ribbon-buscar__atajo">{{atajoBuscar}}</kbd>
    </button>
    <div class="ribbon-spacer" aria-hidden="true"></div>
    <!-- El centro de notificaciones de Yosiftware (ecosistema-kit/NOTIFICACIONES.md): sin sesión no enseña nada. -->
    <yosi-notificaciones class="ribbon-notificaciones" (yosi-notificacion-abrir)="onNotificacionAbrir($event)"></yosi-notificaciones>
    <!-- Las webs del ecosistema y el panel de cuentas, obligatorios en la cabecera (ecosistema-kit/ACCESO.md). -->
    <yosi-webs class="ribbon-yosi"></yosi-webs>
    <yosi-acceso class="ribbon-yosi ribbon-yosi--cuenta"></yosi-acceso>
</div>

<mat-menu #menuArchivo="matMenu" [class]="'menuSuperficieOscura'">
    <div class="ribbon-menu-shell"
        (mouseenter)="cancelarCierreRibbonMenu()"
        (mouseleave)="programarCierreRibbonMenu(archivoTrigger)">
        <div class="menu-user-state" (click)="$event.stopPropagation()">
            <span class="menu-user-state__eyebrow">Sesión actual</span>
            <strong class="menu-user-state__title">{{usr}}</strong>
            <span class="menu-user-state__subtitle">{{userSubLabel}}</span>
        </div>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="abrirMiPerfil()">
            <mat-icon>account_circle</mat-icon>
            <span>Mi perfil</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="abrirSocial()">
            <mat-icon>hub</mat-icon>
            <span>Social</span>
        </button>

        <div class="menu-separator" *ngIf="isLoggedIn" (click)="$event.stopPropagation()"></div>

        <button mat-menu-item *ngIf="isLoggedIn" class="menu-entry-danger" (click)="logOut()">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
        </button>

        <button mat-menu-item *ngIf="!isLoggedIn" (click)="openSesionDialog()">
            <mat-icon>login</mat-icon>
            <span>Entrar</span>
        </button>
    </div>
</mat-menu>

<mat-menu #menuManuales="matMenu" [class]="'menuSuperficieOscura menuSuperficieOscura--wide'">
    <div class="manuales-menu"
        (click)="$event.stopPropagation();"
        (mouseenter)="cancelarCierreRibbonMenu()"
        (mouseleave)="programarCierreRibbonMenu(menuTrigger)">
        <p class="menu-estado" *ngIf="isLoading">
            Cargando manuales...
        </p>

        <p class="menu-estado tw-text-[#dc3545]" *ngIf="!isLoading && errorState">
            {{errorState}}
        </p>

        <p class="menu-estado tw-text-[#ffc107]" *ngIf="!isLoading && !errorState && fallbackNotice">
            {{fallbackNotice}}
        </p>

        <p class="menu-estado" *ngIf="!isLoading && !errorState && manuales.length === 0">
            Todavía no hay manuales en la caché.
        </p>

        <div class="manuales-lista" *ngIf="!isLoading && !errorState && manuales.length > 0">
            <div class="manual-item manual-item-clickable" *ngFor="let manual of manuales"
                matTooltip="Abrir vista del manual" [matTooltipShowDelay]="180"
                (click)="abrirManual(manual, $event, menuTrigger)">
                <div class="manual-linea">
                    <div class="manual-nombre">{{manual.Nombre}}</div>
                    <div class="manual-actions">
                        <span class="chip chip-estado" [ngClass]="manual.Oficial ? 'chip-oficial' : 'chip-homebrew'">
                            {{manual.Oficial ? 'Oficial' : 'Homebrew'}}
                        </span>
                    </div>
                </div>
                <div class="manual-chips">
                    <span class="chip chip-categoria" *ngFor="let categoria of getCategorias(manual)">
                        <mat-icon class="chip-categoria-icon">{{categoria.icono}}</mat-icon>
                        {{categoria.label}}
                    </span>
                </div>
            </div>
        </div>
    </div>
</mat-menu>

<mat-menu #menuOpciones="matMenu" [class]="'menuSuperficieOscura menuSuperficieOscura--options'">
    <div class="options-menu ribbon-menu-shell"
        (click)="$event.stopPropagation()"
        (mouseenter)="cancelarCierreRibbonMenu()"
        (mouseleave)="programarCierreRibbonMenu(opcionesTrigger)">
        <div class="options-section">
            <span class="options-section__eyebrow">Cuenta</span>
            <button mat-menu-item [disabled]="!isLoggedIn" (click)="abrirSeccionPerfil('resumen')">
                <mat-icon>badge</mat-icon>
                <span>Mi cuenta</span>
            </button>
            <button mat-menu-item [disabled]="!isLoggedIn" (click)="abrirSeccionPerfil('preferencias')">
                <mat-icon>tune</mat-icon>
                <span>Preferencias de Rol</span>
            </button>
            <button mat-menu-item [disabled]="!isLoggedIn" (click)="editarPerfilPlataforma()">
                <mat-icon>account_circle</mat-icon>
                <span>Perfil de Yosiftware</span>
            </button>
            <!-- Sin sesión, el SDK explica qué sabe Yosiftware de quien usa Rol sin cuenta. -->
            <button mat-menu-item (click)="abrirPrivacidad()">
                <mat-icon>lock</mat-icon>
                <span>Privacidad</span>
            </button>
        </div>

        <div class="options-section" *ngIf="!isLoggedIn">
            <button mat-menu-item (click)="openSesionDialog()">
                <mat-icon>login</mat-icon>
                <span>Entrar</span>
            </button>
        </div>
    </div>
</mat-menu>

<mat-menu #menuAyuda="matMenu" [class]="'menuSuperficieOscura'">
    <div class="ribbon-menu-shell"
        (mouseenter)="cancelarCierreRibbonMenu()"
        (mouseleave)="programarCierreRibbonMenu(ayudaTrigger)">
        <button mat-menu-item (click)="abrirAyuda('primeros-pasos')">
            <mat-icon>help_center</mat-icon>
            <span>Primeros pasos</span>
        </button>
        <button mat-menu-item (click)="abrirAyuda('novedades')">
            <mat-icon>map</mat-icon>
            <span>Novedades</span>
        </button>
        <button mat-menu-item (click)="abrirAyuda('legal')">
            <mat-icon>gavel</mat-icon>
            <span>Legal y privacidad</span>
        </button>
        <a mat-menu-item [href]="urlCompanion" target="_blank" rel="noopener">
            <mat-icon>phone_android</mat-icon>
            <span>Descargar 3.5 Companion</span>
        </a>
        <button mat-menu-item (click)="abrirReportarBug()">
            <mat-icon>bug_report</mat-icon>
            <span>Reportar bug</span>
        </button>
        <button mat-menu-item (click)="abrirSolicitarFuncionalidad()">
            <mat-icon>lightbulb</mat-icon>
            <span>Solicitar funcionalidad</span>
        </button>
    </div>
</mat-menu>
