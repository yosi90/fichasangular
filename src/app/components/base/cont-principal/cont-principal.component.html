<!-- El marco: el menú lateral y las pestañas. Por debajo de 960 px (el móvil y el plegable abierto), el menú es un cajón
     que se abre con el botón «Menú» de la cinta y se cierra al elegir, con Esc, con el fondo o con el gesto atrás. -->
<mat-sidenav-container class="marco" [hasBackdrop]="enCajon" [class.marco--cajon]="enCajon" [class.marco--movil]="esMovil">
    <mat-sidenav id="marco-menu" class="marco__menu" [mode]="enCajon ? 'over' : 'side'" [opened]="!enCajon || menuAbierto"
        [disableClose]="!enCajon" [autoFocus]="enCajon ? 'first-tabbable' : false" (closedStart)="alCerrarCajon()"
        [attr.role]="enCajon ? 'dialog' : null" [attr.aria-label]="enCajon ? 'Menú' : null" [attr.aria-modal]="enCajon ? 'true' : null">
        <div class="marco__menu-cabecera" *ngIf="enCajon">
            <span class="marco__menu-titulo">Menú</span>
            <button type="button" mat-icon-button class="marco__menu-cerrar" aria-label="Cerrar el menú" (click)="cerrarMenu()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <!-- El menú del tema: por acción (A y C) o por catálogo (B, cargado bajo demanda). -->
        <app-base-menu *ngIf="menuLateral === 'accion'" (NuevoPersonajeTab)="AbrirNuevoPersonaje()" (ListadoTab)="abrirListado($event)"></app-base-menu>
        <ng-container *ngIf="menuLateral === 'catalogo' && menuCatalogo" [ngComponentOutlet]="menuCatalogo" [ngComponentOutletInjector]="injectorMenu"></ng-container>
    </mat-sidenav>
    <mat-sidenav-content class="marco__contenido">
        <mat-card id="base">
            <app-tab-control
                [AbrirNuevoPersonajeTab]="NuevoPersonaje"
                (CerrarNuevoPersonajeTab)="CerrarNuevoPersonaje()"
                [AbrirListadoTab]="Listado"
                [ListadoTabTipo]="TipoListado"
                [ListadoTabOperacion]="OperacionListado"
                (CerrarListadoTab)="CerrarListado()"
                (NuevoPersonajeSolicitado)="solicitarNuevoPersonaje()">
            </app-tab-control>
        </mat-card>
    </mat-sidenav-content>
</mat-sidenav-container>
